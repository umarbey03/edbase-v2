# =============================================================================
#  ZIN-NUR v2 — PRODUCTION HOST NGINX (teskari proksi + TLS)
# =============================================================================
#
#  BU FAYL QAYERDA ISHLAYDI: HOST mashinasida, Docker'dan TASHQARIDA.
#  (Konteyner ichidagi frontend nginx'i — bu boshqa fayl: frontend/nginx.conf)
#
#  O'RNATISH:
#      sudo cp infra/nginx/zinnur.conf /etc/nginx/conf.d/zinnur.conf
#      sudo nginx -t          # sintaksisni tekshirish — MAJBURIY
#      sudo systemctl reload nginx
#
#  DOMENNI ALMASHTIRISH (fayl bo'ylab 2 ta domen ishlatilgan):
#      sudo sed -i 's/zinnuronline\.uz/sizning-domen.uz/g' /etc/nginx/conf.d/zinnur.conf
#  Nginx muhit o'zgaruvchilarini O'QIMAYDI, shuning uchun domen bu yerda
#  matn sifatida turadi — .env dagi DOMAIN qiymati bu faylga ta'sir qilmaydi.
#
# =============================================================================
#  🔴 DOMEN 2026-08-30 DA `zinnur.uz` DAN `zinnuronline.uz` GA O'ZGARTIRILDI
# =============================================================================
#
#  ⚠️ `zinnur.uz` — BU LOYIHAGA ALOQADOR EMAS. U markazning ALOHIDA,
#     MUSTAQIL platformasi. Bu fayl ilgari o'sha domenni `server_name`
#     sifatida e'lon qilardi, ya'ni serverga qo'yilganda BU loyihaning
#     nginx'i markazning asosiy domenini O'ZIGA OLIB QO'YARDI.
#
#     Bu shunchaki noto'g'ri sozlama emas edi — ishlab turgan BOSHQA
#     saytni sindirish xavfi edi. Shu sababli bu faylda `zinnur.uz`
#     BOSHQA UCHRAMASLIGI kerak; uchrasa — xato.
#
#  🔴 DEPLOY TARTIBI. Bu faylni serverga qo'yishdan OLDIN:
#
#      1) DNS — zinnuronline.uz, www.zinnuronline.uz va
#         livekit.zinnuronline.uz A-yozuvlari serverning oq IP'siga
#         qaratilgan bo'lsin;
#
#      2) SERTIFIKAT olingan bo'lsin:
#           sudo certbot certonly --webroot -w /var/www/certbot \
#                -d zinnuronline.uz -d www.zinnuronline.uz
#           sudo certbot certonly --webroot -w /var/www/certbot \
#                -d livekit.zinnuronline.uz
#
#     Sertifikatsiz `nginx -t` YIQILADI ("cannot load certificate") va
#     reload o'tmaydi. Bu — himoya: `nginx -t` ni O'TKAZIB YUBORMANG,
#     u sizni yarim sozlangan holatda ishga tushishdan saqlaydi.
#
#  TRAFIK OQIMI:
#      Brauzer --443/TLS--> HOST NGINX --HTTP--> 127.0.0.1 dagi konteynerlar
#
#  NEGA TLS AYNAN SHU YERDA (konteynerda emas):
#    * Sertifikat bitta joyda — certbot host'da ishlaydi, konteynerlarni
#      qayta yig'ish shart emas.
#    * Konteynerlar oddiy HTTP gapiradi => sozlash sodda, xato kam.
#    * Host nginx barcha xizmatlar uchun yagona kirish nuqtasi bo'ladi.
#
#  MUHIM: bu fayl `/etc/nginx/conf.d/` ichiga tushadi, ya'ni u ALLAQACHON
#  `http { }` bloki ICHIDA. Shuning uchun bu yerda `http {` YOZILMAYDI.
# =============================================================================


# =============================================================================
#  1. WEBSOCKET UCHUN `Connection` SARLAVHASI — HAL QILUVCHI QISM
# =============================================================================
#  WebSocket ochilishi HTTP so'rovi bilan boshlanadi va u ikkita sarlavhaga
#  tayanadi:  `Upgrade: websocket`  va  `Connection: upgrade`.
#
#  Muammo: nginx proksilashda `Connection` sarlavhasini O'CHIRIB tashlaydi
#  (u "hop-by-hop" sarlavha hisoblanadi). Natijada backend upgrade so'rovini
#  ko'rmaydi va SignalR WebSocket'dan long-polling'ga tushib ketadi
#  (yoki umuman ulanmaydi).
#
#  Quyidagi `map` shu muammoni hal qiladi:
#    * $http_upgrade bo'sh emas  -> "upgrade"  (WebSocket so'rovi)
#    * $http_upgrade bo'sh       -> "close"    (oddiy HTTP so'rovi)
#
#  NEGA shunchaki `Connection "upgrade"` deb yozib qo'ymaymiz: u holda
#  ODDIY HTTP so'rovlar ham "upgrade" sarlavhasi bilan ketadi va keep-alive
#  buziladi — har so'rovga yangi TCP ulanish ochiladi. 200 foydalanuvchida
#  bu serverni portlarsiz qoldiradi.
#
#  `map` `http` kontekstida bo'lishi kerak — conf.d shu kontekst ichida.
# =============================================================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}


# =============================================================================
#  2. UPSTREAM'LAR (orqa tomondagi xizmatlar)
# =============================================================================
#  Manzillar 127.0.0.1 — chunki docker-compose.prod.yml portlarni AYNAN
#  loopback'ga bog'laydi ("127.0.0.1:5080:8080"). Ya'ni bu portlarga
#  internetdan TO'G'RIDAN-TO'G'RI kirib bo'lmaydi, faqat shu nginx orqali.
#
#  ESLATMA: agar nginx'ni ham konteynerda ishlatmoqchi bo'lsangiz,
#  127.0.0.1 ni xizmat nomlariga almashtiring (api:8080, web:80, livekit:7880)
#  va nginx'ni `zinnur-net` tarmog'iga ulang.
# =============================================================================

upstream zinnur_api {
    server 127.0.0.1:5080 max_fails=3 fail_timeout=10s;

    # keepalive: nginx backend bilan ulanishlarni OCHIQ saqlaydi va qayta
    # ishlatadi. 200 foydalanuvchi uchun juda muhim — har so'rovga yangi
    # TCP ochish (3 qadamli qo'l berish) kechikish qo'shadi va host'dagi
    # bo'sh portlarni tugatadi (TIME_WAIT to'planishi).
    # 64 = bo'sh turgan ulanishlar zaxirasi.
    keepalive 64;
    keepalive_timeout 60s;
}

upstream zinnur_web {
    server 127.0.0.1:5173 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream zinnur_livekit {
    # LiveKit signalling (WebSocket + REST). Media BU YERDAN O'TMAYDI —
    # u to'g'ridan-to'g'ri UDP 7882 / TCP 7881 orqali boradi (nginx'siz).
    server 127.0.0.1:7880 max_fails=3 fail_timeout=10s;
    keepalive 32;
}


# =============================================================================
#  3. TEZLIKNI CHEKLASH (brute-force himoyasi)
# =============================================================================
#  Login endpoint parolni tekshiradi, ya'ni u BCrypt hisoblaydi (ataylab
#  sekin, ~100 ms). Cheklovsiz hujumchi shu bitta manzil bilan protsessorni
#  100% band qilib, 200 ta haqiqiy foydalanuvchini darsdan mahrum qiladi.
#
#  binary_remote_addr: IP manzilni ixcham saqlaydi. 10 MB zona ~160 000 IP.
# =============================================================================
limit_req_zone $binary_remote_addr zone=zinnur_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=zinnur_api:10m   rate=30r/s;

# --- FAYL YUKLASH uchun ALOHIDA zona -----------------------------------------
# NEGA `zinnur_api` (30r/s) yuklashga TO'G'RI KELMAYDI: u so'rov SONINI
# cheklaydi, yuklashda esa muammo son emas — bitta so'rov 2 GB tana bilan
# soatlab ochiq turadi. Ya'ni 30r/s "himoya" yuklash hujumiga hech qanday
# to'siq qo'ymaydi (sekundiga 30 ta × 2 GB = diskni/kanalni to'ldirish).
#
# 🔴 MUHIMI: `limit_req` MEROS BO'LMAYDI. `/api/` blokidagi cheklov quyidagi
# yuklash bloklariga O'TMAYDI — shuning uchun ular ATAYLAB shu zonani
# ishlatadi, aks holda yuklash yo'llari umuman cheklovsiz qolardi.
#
# 1r/s + burst=30: o'qituvchi imtihon uchun 30 ta rasmni yoki videoning
# bir necha qismini ketma-ket yuklashi normal (burst hammasini o'tkazadi),
# lekin uzluksiz "quvur" (sekundiga o'nlab 2 GB so'rov) to'xtatiladi.
limit_req_zone $binary_remote_addr zone=zinnur_upload:10m rate=1r/s;

# Bitta IP dan bir vaqtda ochiladigan ulanishlar soni.
# Diqqat: bitta maktab/ofis NAT ortida bo'lsa, o'nlab talaba BITTA IP dan
# keladi. Shuning uchun chegara saxovatli — 100.
limit_conn_zone $binary_remote_addr zone=zinnur_conn:10m;


# =============================================================================
#  4. HTTP (80) -> HTTPS YO'NALTIRISH
# =============================================================================
#  Ikkala domen uchun ham. Yagona istisno — Let's Encrypt tekshiruvi.
# =============================================================================
server {
    listen      80;
    listen      [::]:80;
    server_name zinnuronline.uz www.zinnuronline.uz livekit.zinnuronline.uz;

    # --- ACME (Let's Encrypt) tekshiruvi ---
    # Certbot shu papkaga fayl qo'yadi, Let's Encrypt esa uni HTTP orqali
    # o'qiydi. BU JOY YO'NALTIRILMASLIGI KERAK, aks holda sertifikat
    # yangilanmaydi va 90 kundan keyin sayt "ishonchsiz" bo'lib qoladi.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Qolgan hamma narsa HTTPS ga.
    # 301 (doimiy): brauzer buni eslab qoladi va keyingi safar to'g'ridan
    # to'g'ri HTTPS ga boradi.
    location / {
        return 301 https://$host$request_uri;
    }
}


# =============================================================================
#  5. ASOSIY DOMEN — https://zinnuronline.uz
# =============================================================================
server {
    # ⚠️ `http2` AYNAN SHU YERDA, alohida `http2 on;` direktivasi EMAS:
    # u faqat nginx 1.25.1+ da bor, Ubuntu 24.04 LTS esa 1.24 bilan keladi
    # va `unknown directive "http2"` bilan ishga tushmaydi.
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name zinnuronline.uz www.zinnuronline.uz;

    # -------------------------------------------------------------------------
    #  TLS
    # -------------------------------------------------------------------------
    #  Sertifikatni olish (bir marta):
    #      sudo certbot certonly --webroot -w /var/www/certbot \
    #           -d zinnuronline.uz -d www.zinnuronline.uz
    #
    #  Certbot avtomatik yangilaydi (systemd timer). Yangilangach nginx'ni
    #  qayta yuklash kerak — buni deploy hook qiladi:
    #      /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
    #          #!/bin/sh
    #          systemctl reload nginx
    # -------------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/zinnuronline.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zinnuronline.uz/privkey.pem;

    # Zanjirni tekshirish uchun (OCSP stapling'ga kerak).
    ssl_trusted_certificate /etc/letsencrypt/live/zinnuronline.uz/chain.pem;

    # Faqat zamonaviy protokollar. TLSv1.0/1.1 buzilgan va PCI DSS taqiqlagan.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Shifrlar: faqat forward secrecy (ECDHE) beradiganlari.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;   # TLSv1.3 da klient tanlovi afzalroq

    # --- TLS sessiya keshi: 200 foydalanuvchi uchun sezilarli ---
    # Dars boshlanganda 200 kishi bir vaqtda ulanadi. To'liq TLS
    # "qo'l berishi" qimmat (asimmetrik kriptografiya). Kesh qayta
    # ulanishlarni ANCHA arzonlashtiradi.
    # 10 MB ~ 40 000 sessiya.
    ssl_session_cache   shared:ZinnurTLS:10m;
    ssl_session_timeout 1d;
    # Session tickets o'chiq: forward secrecy'ni zaiflashtiradi
    # (kalit aylanmasa eski trafikni ochish mumkin bo'ladi).
    ssl_session_tickets off;

    # OCSP stapling: sertifikat bekor qilinmaganini server O'ZI tasdiqlaydi.
    # Brauzer CA serveriga bormaydi => sahifa ~100-300 ms tez ochiladi.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # -------------------------------------------------------------------------
    #  XAVFSIZLIK SARLAVHALARI
    # -------------------------------------------------------------------------
    #  `always` — xato javoblarda (4xx/5xx) ham yuborilsin degani.
    #  Usiz 404 sahifasi himoyasiz qoladi.
    # -------------------------------------------------------------------------

    # HSTS — brauzerga "bu domenga FAQAT HTTPS orqali kir" deydi.
    # Birinchi tashrifdan keyin brauzer http:// ni umuman ishlatmaydi,
    # ya'ni yo'ldagi hujumchi ulanishni HTTP ga tushira olmaydi.
    #
    # DIQQAT: max-age=2 yil + includeSubDomains QAYTARIB BO'LMAYDI.
    # Agar biror subdomen TLS'siz ishlashi kerak bo'lsa — oldin uni hal
    # qiling. Sinov paytida max-age=300 qo'yib turing.
    # `preload` ataylab YO'Q: u brauzerlarga "qattiq" yoziladi va uni
    # ro'yxatdan chiqarish oylar oladi. Barqaror ishlaganidan keyin qo'shing.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # MIME turini "taxmin qilish"ni to'sish (XSS vektorlaridan biri).
    add_header X-Content-Type-Options "nosniff" always;

    # Clickjacking: saytni begona <iframe> ichiga solishni taqiqlash.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Tashqi saytga o'tganda to'liq manzilni (dars ID'si bilan) oshkor qilmaslik.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Kerak bo'lmagan brauzer imkoniyatlarini o'chirish.
    # DIQQAT: camera va microphone `self` bo'lishi SHART — ular o'chirilsa
    # video dars UMUMAN ishlamaydi (getUserMedia bloklanadi).
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=()" always;

    # -------------------------------------------------------------------------
    #  CONTENT SECURITY POLICY (izohda — ehtiyotkorlik bilan yoqiladi)
    # -------------------------------------------------------------------------
    #  CSP XSS'ga qarshi eng kuchli himoya, LEKIN noto'g'ri sozlansa saytni
    #  butunlay ishdan chiqaradi. Shuning uchun ataylab o'chiq turibdi.
    #
    #  YOQISH TARTIBI:
    #   1) avval `Content-Security-Policy-Report-Only` bilan sinang,
    #   2) brauzer konsolidagi buzilishlarni tuzating,
    #   3) keyin haqiqiy sarlavhaga o'ting.
    #
    #  ZIN-NUR uchun MUHIM nuqtalar:
    #   * connect-src da wss:// MAJBURIY — SignalR va LiveKit WebSocket'lari.
    #   * media-src blob: — LiveKit video oqimlari blob URL ishlatadi.
    #   * worker-src blob: — LiveKit shovqin bostirish uchun Web Worker ochadi.
    #   * frame-src youtube-nocookie — landing sahifadagi BEPUL DARS videosi
    #     (2026-08-29). Busiz video maydoni JIMGINA bo'sh qoladi: brauzer
    #     iframe'ni bloklaydi va sahifada hech qanday xato ko'rinmaydi.
    #   * img-src img.youtube.com — o'sha videoning poster tasviri. Iframe
    #     faqat bosilganda yuklanadi, poster esa DARHOL ko'rinadi, ya'ni
    #     bu ikkisi ALOHIDA ruxsat talab qiladi.
    #
    #  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.youtube.com; media-src 'self' blob:; worker-src 'self' blob:; frame-src https://www.youtube-nocookie.com; connect-src 'self' wss://livekit.zinnuronline.uz https://zinnuronline.uz; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    # -------------------------------------------------------------------------

    # -------------------------------------------------------------------------
    #  SO'ROV TANASI HAJMI — STANDART QAT'IY, ISTISNOLAR YO'L BO'YICHA
    # -------------------------------------------------------------------------
    #  🔴 BU QIYMAT 10m BO'LIB QOLISHI KERAK.
    #  Fayl yuklash endpointlari paydo bo'lganda (dars videosi 2 GB gacha)
    #  eng oson yo'l shu qatorni `2049m` qilib qo'yish bo'lardi — LEKIN bu
    #  xavfsizlik regressiyasi: u holda SAYTDAGI HAR BIR yo'l, jumladan
    #  autentifikatsiyasiz `/api/v1/auth/login` ham, 2 GB tana qabul
    #  qiladigan bo'lardi. Bitta noutbukdan bir necha ulanish bilan diskni
    #  yoki kanalni to'ldirib qo'yish mumkin bo'lardi.
    #
    #  Shuning uchun chegara FAQAT yuklash yo'llarida ko'tariladi
    #  (5.2-bo'limdagi regex bloklar). Qolgan hamma joyda 10m — REST
    #  JSON so'rovlari uchun bu juda saxovatli.
    # -------------------------------------------------------------------------
    client_max_body_size 10m;

    # Bitta IP dan ulanishlar (NAT ortidagi maktablarni hisobga olib).
    # SINTAKSIS ESLATMASI: `limit_conn` zona nomini TO'G'RIDAN-TO'G'RI oladi
    # (`zone=` prefiksi YO'Q — u faqat `limit_req` da ishlatiladi).
    # `limit_conn zone=zinnur_conn 100;` deb yozilsa nginx ishga tushmaydi:
    # "zero size shared memory zone".
    limit_conn zinnur_conn 100;

    # Proksilangan javoblarni siqish.
    #
    # 🔴 `gzip_types` GA `video/*`, `audio/*` YOKI `application/octet-stream`
    # QO'SHILMASIN. Sabablari:
    #   * video/audio allaqachon siqilgan — foyda ~0, protsessor esa yonadi;
    #   * gzip `Content-Length` ni o'zgartiradi va bayt oraliqlari (`Range`)
    #     mos kelmay qoladi => pleyerda seek buziladi.
    # Nginx gzip filtri 206 (Partial Content) javoblarni umuman siqmaydi
    # (faqat 200/403/404), lekin `Range` SO'RALMAGAN to'liq 200 javob
    # siqilib ketishi mumkin edi. Fayl oqimi bloklarida (5.2.4) qo'shimcha
    # `gzip off` qulfi ham bor.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    access_log /var/log/nginx/zinnur.access.log;
    error_log  /var/log/nginx/zinnur.error.log warn;

    # =========================================================================
    #  5.1  /hubs/  -> SIGNALR (WEBSOCKET) — ENG NOZIK BLOK
    # =========================================================================
    #  SPEC 6-bo'lim: hub yo'li `/hubs/live`, autentifikatsiya
    #  `?access_token=<jwt>` query parametri orqali (WebSocket maxsus
    #  sarlavha yubora olmaydi).
    #
    #  Bu blok `/api/` DAN OLDIN turishi shart emas (yo'llar kesishmaydi),
    #  lekin aniqlik uchun birinchi qo'yilgan.
    # =========================================================================
    location /hubs/ {
        proxy_pass http://zinnur_api;

        # HTTP/1.1 MAJBURIY: WebSocket upgrade HTTP/1.0 da mavjud emas.
        proxy_http_version 1.1;

        # --- Upgrade juftligi: WebSocket'ning yuragi ---
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # BACKEND buni o'qishi uchun ForwardedHeaders middleware yoqilishi
        # kerak, aks holda ASP.NET o'zini HTTP deb hisoblab, HTTPS
        # yo'naltirishlarini noto'g'ri yasaydi.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # --- TIMEOUT: BU YERDAGI ENG MUHIM SOZLAMA ---
        # WebSocket ulanishi soatlab OCHIQ turadi va unda uzoq vaqt
        # HECH QANDAY ma'lumot yurmasligi mumkin (hech kim yozmayotgan chat).
        # Nginx standarti — 60 sekund. Ya'ni sozlanmasa, har 60 sekundda
        # 200 ta talabaning ulanishi UZILADI va hammasi qayta ulanadi.
        # Bu backend'ga "portlash" yukini beradi va chat/presence buziladi.
        # 3600s = 1 soat: odatiy dars davomiyligidan uzun.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;

        # Buferlashni O'CHIRISH — SignalR uchun SHART.
        # Nginx javobni to'plab, keyin yuborsa, real vaqt yo'qoladi:
        # xabar chatda bir necha sekund kechikib chiqadi. WebSocket
        # fallback rejimlarida (SSE, long-polling) esa umuman ishlamaydi.
        proxy_buffering  off;
        proxy_cache      off;
        proxy_request_buffering off;
    }

    # =========================================================================
    #  5.2  FAYL YUKLASH VA VIDEO OQIMI (REGEX BLOKLAR)
    # =========================================================================
    #  NIMA UCHUN BU BLOKLAR BOR:
    #    Backend dars materiallari uchun quyidagi yo'llarni beradi
    #    (LessonAssetsController, AssignmentsController):
    #
    #      POST   /api/v1/lessons/{lessonId}/assets            video, 2 GB gacha
    #      GET    /api/v1/lessons/assets/{assetId}             oqim + Range
    #      DELETE /api/v1/lessons/assets/{assetId}
    #      POST   /api/v1/assignments/{id}/attachments         rasm/audio, 100 MB
    #      GET    /api/v1/assignments/attachments/{id}         oqim + Range
    #      POST   /api/v1/assignments/{id}/submit              o'quvchi javobi, 51 MB
    #      GET    /api/v1/submissions/files/{fileId}           oqim + Range
    #
    #    Ular `location /api/` bilan xizmat qilinganda IKKI joyda sinadi:
    #      1) `client_max_body_size 10m` -> 1 GB video **413** bilan qaytadi
    #         va backendga UMUMAN yetib bormaydi (Kestrel chegaralari,
    #         sozlamalar, MIME tekshiruvi — hammasi behuda);
    #      2) `proxy_read_timeout 60s` -> yuklash o'rtasida **504**;
    #      3) `proxy_request_buffering on` (standart) -> nginx butun 2 GB ni
    #         DISKKA yozib, keyin backendga uzatadi;
    #      4) `proxy_buffering on` -> video javobi temp fayllarga spool
    #         bo'ladi, `Range`/seek samarasi yo'qoladi.
    #
    #  ☢️ LOCATION USTUVORLIGI — bu yerda ENG KO'P XATO QILINADI.
    #    Nginx `location` ni FAYLDAGI TARTIB bo'yicha tanlamaydi, quyidagi
    #    ustuvorlik bo'yicha tanlaydi:
    #      1) `= /aniq/yo'l`     — mos kelsa qidiruv DARHOL tugaydi
    #      2) `^~ /prefiks`      — eng uzun mos prefiks `^~` bo'lsa,
    #                              regexlar TEKSHIRILMAYDI
    #      3) `~` / `~*` regex   — FAYLDAGI TARTIBDA, birinchi mos kelgani
    #      4) oddiy prefiks      — regex mos kelmasa, eng uzuni
    #
    #    Ya'ni quyidagi regexlar `location /api/` (oddiy prefiks) dan HAR
    #    QANDAY holatda ustun keladi — hatto fayl OXIRIDA yozilsa ham.
    #    Ular `/api/` dan oldin turishi FAQAT o'qish qulayligi uchun.
    #
    #    Kesishuvlar tekshirildi:
    #      * `location = /api/v1/auth/login` — aniq mos, regexlardan ham
    #        ustun; lekin yo'l kesishmaydi, ziddiyat YO'Q.
    #      * `location ^~ /health` — `^~`, lekin `/api/` bilan kesishmaydi.
    #      * `PUT /api/v1/lessons/{id}/assets/reorder` — regexlar `$` bilan
    #        TUGATILGAN, shuning uchun reorder (kichik JSON) ATAYLAB
    #        `/api/` blokida qoladi: 10m + 60s + umumiy rate limit.
    #
    #  🔴 NGINX `location` LARNI MEROS QILMAYDI — QAYSI DIREKTIVA TAKRORLANDI:
    #    * `proxy_set_header` — blokda BITTASI yozilsa, tashqi darajadagi
    #      BUTUN to'plam bekor bo'ladi => beshtasi ham takrorlanadi.
    #    * `limit_req` — `/api/` dagi cheklov o'tmaydi => yuklashga
    #      `zinnur_upload`, oqimga `zinnur_api` zonasi aniq yoziladi.
    #    * `proxy_pass`, `proxy_http_version`, timeoutlar, buferlar —
    #      har blokda qaytadan.
    #    * `add_header` — ATAYLAB YOZILMAGAN! Nginx `add_header` ni faqat
    #      blok O'ZIDA bitta ham `add_header` bo'lmasa meros qiladi.
    #      Shu sababli server darajasidagi HSTS / nosniff / X-Frame-Options /
    #      Referrer-Policy / Permissions-Policy shu yo'llarda ham ishlaydi.
    #      ⚠️ Bu bloklarga BITTA `add_header` qo'shilsa — o'sha beshta
    #      xavfsizlik sarlavhasi shu yo'llarda JIMGINA YO'QOLADI.
    #    * `client_max_body_size`, `limit_conn`, `gzip*`, TLS, loglar —
    #      server darajasidan meros bo'ladi (qayta yozilmasa).
    #    * `Authorization` va boshqa KLIENT sarlavhalari — nginx ularni
    #      standart holda o'zi uzatadi (`proxy_pass_request_headers on`),
    #      qo'lda yozish KERAK EMAS.
    #    * CORS — bu loyihada nginx CORS bilan SHUG'ULLANMAYDI (backend
    #      `UseCors` qiladi), takrorlanadigan narsa yo'q.
    #
    #  NEGA `include` bilan umumiy faylga chiqarilmadi: `infra/scripts/
    #  server-init.sh` serverga AYNAN BITTA faylni ko'chiradi
    #  (`infra/nginx/zinnur.conf` -> `/etc/nginx/sites-available/`).
    #  `include snippets/api-proxy.conf` yozilsa, prod'da nginx
    #  "No such file or directory" bilan UMUMAN ishga tushmaydi.
    #  Takrorlanish ataylab — deploy zanjiri sodda qolsin.
    # =========================================================================

    # --- 5.2.1  DARS VIDEOSINI YUKLASH: POST /api/v1/lessons/{id}/assets -----
    location ~ ^/api/v1/lessons/[0-9]+/assets$ {
        # Yuklash uchun alohida zona (yuqoridagi izohga qarang).
        limit_req zone=zinnur_upload burst=30 nodelay;
        limit_req_status 429;

        # --- TANA HAJMI ------------------------------------------------------
        # Kestrel tomonidagi chegara: 2048 MiB + 1 MiB
        # (LessonAssetsController.MaxUploadBytes). Nginx AYNAN shuncha beradi.
        #
        # NEGA 2048m EMAS, 2049m: multipart o'rami faylning O'ZIDAN katta
        # (chegara satrlari + `Content-Disposition` sarlavhalari). Nginx
        # 2048m qo'ysa, aynan 2048 MB li video (sozlamadagi maksimum)
        # nginx'ning quruq HTML 413 si bilan qaytardi. Chegarani BACKEND
        # qo'llasin — u tushunarli JSON xato va aniq sabab qaytaradi.
        client_max_body_size 2049m;

        # --- DISKKA BUFERLAMASLIK (eng muhim qator) --------------------------
        # Standart `on` da nginx butun 2 GB ni `client_body_temp` ga yozadi,
        # KEYIN backendga uzatadi. Natijasi:
        #   * disk 2 GB × parallel yuklash soniga to'ladi (server yiqiladi),
        #   * har bayt ikki marta disk I/O,
        #   * foydalanuvchi progress 100% ni ko'radi, keyin yana kutadi,
        #   * autentifikatsiyasiz hujumchi ham diskni to'ldira oladi
        #     (`off` bo'lsa backend 401 ni sarlavhada beradi va oqim uziladi).
        proxy_request_buffering off;

        # Bu timeout — tananing BO'LAKLARI orasidagi tanaffus (umumiy vaqt
        # emas). Standart 60s sekin mobil internetda yuklashni o'rtasida
        # uzadi. Umumiy davomiylikni cheklamaydi.
        client_body_timeout 300s;

        # Buferlash o'chirilganda nginx SHU bufer orqali o'qib-uzatadi.
        # Standart 16k bilan 2 GB = ~130 000 o'qish/yozish tsikli.
        client_body_buffer_size 256k;

        proxy_pass http://zinnur_api;
        proxy_http_version 1.1;

        # Upstream keep-alive uchun bo'sh bo'lishi SHART.
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # --- TIMEOUT --------------------------------------------------------
        # 1 GB ni 10 Mbit/s kanalda yuklash ~14 daqiqa, 2 GB — ~28 daqiqa.
        # `/api/` dagi 60s buni HAR SAFAR o'rtasida uzardi (504) va
        # o'qituvchi sababini bilmasdi.
        # `send_timeout` — backendga YOZISH (tanani uzatish) uchun,
        # `read_timeout` — backend javobini kutish uchun (u faylni omborga
        # yozib bo'lgach javob beradi).
        proxy_connect_timeout 10s;
        proxy_send_timeout  3600s;
        proxy_read_timeout  3600s;

        # JAVOB kichik JSON — uni buferlash foydali (`/api/` bilan bir xil).
        proxy_buffering   on;
        proxy_buffers     16 16k;
        proxy_buffer_size 32k;
    }

    # --- 5.2.2  VAZIFA SHARTI BIRIKTIRMASI: POST .../attachments -------------
    # Kestrel: 100 MiB + 1 MiB (AssignmentsController.MaxAttachmentRequestBytes)
    # = `lesson.image_max_mb` sozlamasining MAKSIMUMI. Haqiqiy chegara
    # sozlamadan keladi (standart 10 MB) va backend uni 413 bilan qo'llaydi.
    location ~ ^/api/v1/assignments/[0-9]+/attachments$ {
        limit_req zone=zinnur_upload burst=30 nodelay;
        limit_req_status 429;

        client_max_body_size 101m;
        proxy_request_buffering off;
        client_body_timeout 300s;
        client_body_buffer_size 256k;

        proxy_pass http://zinnur_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout  3600s;
        proxy_read_timeout  3600s;

        proxy_buffering   on;
        proxy_buffers     16 16k;
        proxy_buffer_size 32k;
    }

    # --- 5.2.3  O'QUVCHI JAVOBI: POST /api/v1/assignments/{id}/submit --------
    # ⚠️ BU YO'L YANGI EMAS — u ALLAQACHON ishlab turgan va ALLAQACHON
    # buzilgan edi: Kestrel 5 × 10 MB + 1 MB = 51 MB qabul qilaman deydi
    # (AssignmentsController.MaxRequestBytes), nginx esa 10m da 413 berardi.
    # Ya'ni ikkita audio javob yuborgan o'quvchi "nomalum xato" ko'rardi.
    # Chegara backend bilan bir xil qilinadi — kengaytirish emas, MOSLASH.
    location ~ ^/api/v1/assignments/[0-9]+/submit$ {
        limit_req zone=zinnur_upload burst=30 nodelay;
        limit_req_status 429;

        client_max_body_size 51m;
        proxy_request_buffering off;
        client_body_timeout 300s;
        client_body_buffer_size 256k;

        proxy_pass http://zinnur_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout  600s;
        proxy_read_timeout  600s;

        proxy_buffering   on;
        proxy_buffers     16 16k;
        proxy_buffer_size 32k;
    }

    # =========================================================================
    #  5.2.4  FAYL OQIMI (GET) + O'CHIRISH (DELETE) — `Range` NOZIK JOYI
    # =========================================================================
    #  Bitta regex uchta yo'lni qamrab oladi (talablar aynan bir xil):
    #      /api/v1/lessons/assets/{id}          dars videosi / imtihon rasmi
    #      /api/v1/assignments/attachments/{id} vazifa sharti biriktirmasi
    #      /api/v1/submissions/files/{id}       o'quvchi javobi (audio/rasm)
    #  DELETE ham shu yo'llarda — nginx `location` ni METOD bo'yicha
    #  ajratmaydi. DELETE uchun bu sozlamalar zarar qilmaydi (tanasi yo'q).
    #
    #  🔴 NEGA `proxy_buffering off` MAJBURIY:
    #    `on` bo'lganda nginx javobni avval o'z buferlariga (16×16k), ular
    #    to'lgach TEMP FAYLGA yozadi. 1 GB video uchun bu:
    #      * seek qilganda kutish (nginx butun bo'lakni to'plab oladi),
    #      * har ko'ruvchi uchun diskda vaqtinchalik nusxa,
    #      * bir vaqtda 20 o'quvchi = diskda 20 GB "shovqin".
    #
    #  🔴 GZIP: `Content-Range` bilan gzip ARALASHTIRILMAYDI — siqilgan
    #    javobda bayt raqamlari klient so'ragan oraliqqa MOS KELMAYDI va
    #    `Content-Length` yolg'on bo'ladi (pleyer videoni buzilgan deb
    #    hisoblaydi). Nginx gzip filtri 206 javobni tegmaydi (u faqat
    #    200/403/404 ni siqadi) va server darajasidagi `gzip_types` da
    #    `video/*` ham `application/octet-stream` ham YO'Q — ya'ni hozir
    #    xavf yo'q. Quyidagi `gzip off` — kelajakda kimdir `gzip_types` ga
    #    `application/octet-stream` qo'shsa video buzilmasligi uchun QULF.
    # =========================================================================
    location ~ ^/api/v1/(lessons/assets|assignments/attachments|submissions/files)/[0-9]+$ {
        # Oqim uchun umumiy API zonasi yetarli: pleyer seek qilganda bir
        # nechta `Range` so'rovi yuboradi, lekin ular kichik va tez.
        # (NAT ortidagi maktabda 30 o'quvchi bitta IP dan kelishi hisobga
        # olingan: 30r/s + burst=60.)
        limit_req zone=zinnur_api burst=60 nodelay;

        proxy_pass http://zinnur_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # --- `Range` / `If-Range` -------------------------------------------
        # Nginx bu sarlavhalarni standart holda O'ZI uzatadi — bu qatorlar
        # SHART EMAS, lekin ATAYLAB yozilgan:
        #   * yuqorida `proxy_set_header` to'plami qayta belgilangan, ya'ni
        #     kimdir bu to'plamni "tozalayotganda" `Range` jimgina yo'qolishi
        #     mumkin — u holda seek ishlamay qoladi va sababini topish qiyin;
        #   * niyat ochiq ko'rinadi: bu blok Range uchun mavjud.
        # `$http_range` bo'sh bo'lsa nginx sarlavhani UMUMAN yubormaydi
        # (o'zgaruvchili qiymat bo'sh bo'lsa sarlavha tashlanadi), shuning
        # uchun oddiy (Range'siz) so'rovga zarari yo'q.
        proxy_set_header Range    $http_range;
        proxy_set_header If-Range $http_if_range;

        # `Accept-Ranges`, `Content-Range`, `Content-Length` — backend
        # javobidan KELADI va nginx ularni o'zgartirmasdan uzatadi
        # (`proxy_hide_header` bu yerda ATAYLAB yo'q).

        # --- BUFERLASHNI O'CHIRISH ------------------------------------------
        proxy_buffering off;
        # Ikkinchi qulf: buferlash tasodifan yoqilsa ham diskka spool
        # qilinmaydi (0 = temp fayl ishlatilmaydi).
        proxy_max_temp_file_size 0;
        proxy_cache off;

        # Video/audio javobi hech qachon siqilmaydi (yuqoridagi izoh).
        gzip off;

        # --- TIMEOUT --------------------------------------------------------
        # Buferlash o'chiq bo'lganda nginx upstream'dan klient qanchalik
        # tez o'qisa, shunchalik o'qiydi. Pleyer pauza qilinsa (yoki
        # o'quvchining interneti sekin bo'lsa) upstream o'qishi to'xtab
        # turadi — 60s da javob uzilardi va video "sababsiz" to'xtardi.
        proxy_connect_timeout 10s;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # =========================================================================
    #  5.3  /api/  -> REST API
    # =========================================================================
    #  SPEC 5-bo'lim: baza yo'l `/api/v1`.
    #
    #  ⚠️ FAYL YUKLASH VA OQIM YO'LLARI BU BLOKDA EMAS — 5.2-bo'limda
    #  (regexlar oddiy prefiksdan ustun). Bu blokdagi 10m / 60s / buferlash
    #  qiymatlarini "video uchun" o'zgartirish KERAK EMAS.
    #
    #  DIQQAT — `proxy_pass` OXIRIDA SLASH YO'Q (http://zinnur_api;).
    #  Bu farq juda muhim:
    #    * slashsiz -> to'liq yo'l uzatiladi:  /api/v1/auth/login
    #    * slash bilan -> prefiks KESILADI:    /v1/auth/login  (404!)
    # =========================================================================
    location /api/ {
        # Umumiy tezlik cheklovi. burst=60: qisqa "portlash"ga ruxsat
        # (sahifa ochilganda bir nechta so'rov ketadi), nodelay — ular
        # navbatda kutmasin.
        limit_req zone=zinnur_api burst=60 nodelay;

        proxy_pass http://zinnur_api;
        proxy_http_version 1.1;

        # Keep-alive upstream uchun: bu ikki sarlavha bo'sh bo'lishi kerak,
        # aks holda ulanish qayta ishlatilmaydi.
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # REST so'rovlari qisqa. 60s dan uzoq ketayotgan so'rov — bu bug.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        proxy_buffering on;
        proxy_buffers     16 16k;
        proxy_buffer_size 32k;
    }

    # --- Login: qat'iyroq cheklov (brute-force) -------------------------------
    # Aniqroq `location` umumiy `/api/` dan USTUN keladi.
    # 5r/m + burst=5: odam parolni 2-3 marta xato kiritishi normal,
    # lekin sekundiga o'nlab urinish — bu hujum.
    location = /api/v1/auth/login {
        limit_req zone=zinnur_login burst=5 nodelay;
        # Hujum aniqlanganda 429 qaytaramiz (503 emas) — bu semantik to'g'ri
        # va klient uni to'g'ri talqin qiladi.
        limit_req_status 429;

        proxy_pass http://zinnur_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Sog'liq tekshiruvi (monitoring uchun) --------------------------------
    # Log yozilmaydi — monitoring har 10 sekundda so'raydi, log to'lib ketmasin.
    location ^~ /health {
        access_log off;
        proxy_pass http://zinnur_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # =========================================================================
    #  5.4  /livekit/  -> LIVEKIT SIGNALLING (ZAXIRA YO'L)
    # =========================================================================
    #  TAVSIYA ETILGAN YO'L — quyidagi `livekit.zinnuronline.uz` subdomeni (6-bo'lim).
    #  Bu blok subdomen sozlanmagan holat uchun.
    #
    #  Frontend uchun manzil:  wss://zinnuronline.uz/livekit
    #  (LiveKit klienti unga `/rtc` ni O'ZI qo'shadi -> /livekit/rtc)
    #
    #  DIQQAT — bu yerda `proxy_pass` OXIRIDA SLASH BOR (.../;).
    #  Bu `/livekit/` prefiksini KESADI: /livekit/rtc -> /rtc.
    #  LiveKit `/livekit/rtc` degan yo'lni bilmaydi, faqat `/rtc` ni biladi.
    #  (Yuqoridagi /api/ blokidan aynan shu bilan farq qiladi!)
    # =========================================================================

    # Slashsiz manzilni to'g'rilash: /livekit -> /livekit/
    # Busiz `location /livekit/` mos kelmaydi va 404 chiqadi.
    location = /livekit {
        return 301 https://$host/livekit/;
    }

    location /livekit/ {
        proxy_pass http://zinnur_livekit/;
        proxy_http_version 1.1;

        # WebSocket upgrade — LiveKit signalling to'liq WS ustida ishlaydi.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # LiveKit klientning haqiqiy IP'sini shu sarlavhadan oladi
        # (geografiya va diagnostika uchun).
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dars davomida ulanish uzluksiz ochiq turadi.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;

        proxy_buffering off;
        proxy_cache     off;
    }

    # =========================================================================
    #  5.5  /  -> VUE SPA (oxirgi, eng umumiy qoida)
    # =========================================================================
    #  SPA fallback (`try_files`) KONTEYNER ichidagi nginx'da bajariladi
    #  (frontend/nginx.conf). Bu yerda shunchaki uzatamiz — mantiqni ikki
    #  joyda takrorlash keraksiz va xatoga olib keladi.
    # =========================================================================
    location / {
        proxy_pass http://zinnur_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;

        proxy_buffering on;
    }
}


# =============================================================================
#  6. LIVEKIT SUBDOMENI — https://livekit.zinnuronline.uz  (TAVSIYA ETILGAN)
# =============================================================================
#  NEGA SUBDOMEN YO'L PREFIKSIDAN YAXSHIROQ:
#    * LiveKit klient kutubxonasi yo'l prefikslarini har doim ham to'g'ri
#      ishlatmaydi (u manzilga `/rtc`, `/twirp/...` ni o'zi qo'shadi).
#      Subdomenda hech narsa kesilmaydi — xato ehtimoli nolga tushadi.
#    * Alohida domen = alohida sertifikat va alohida loglar; video
#      muammosini asosiy saytdan ajratib tekshirish oson.
#    * Kelajakda LiveKit boshqa serverga ko'chsa — faqat DNS o'zgaradi,
#      nginx va frontend kodiga tegilmaydi.
#
#  FRONTEND UCHUN MANZIL (SPEC 8 -> LiveKit__Url, prod):
#      wss://livekit.zinnuronline.uz
#
#  Sertifikat:
#      sudo certbot certonly --webroot -w /var/www/certbot -d livekit.zinnuronline.uz
# =============================================================================
server {
    # ⚠️ `http2` AYNAN SHU YERDA, alohida `http2 on;` direktivasi EMAS:
    # u faqat nginx 1.25.1+ da bor, Ubuntu 24.04 LTS esa 1.24 bilan keladi
    # va `unknown directive "http2"` bilan ishga tushmaydi.
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name livekit.zinnuronline.uz;

    ssl_certificate         /etc/letsencrypt/live/livekit.zinnuronline.uz/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/livekit.zinnuronline.uz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/livekit.zinnuronline.uz/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:ZinnurLK:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/livekit.access.log;
    error_log  /var/log/nginx/livekit.error.log warn;

    # DIQQAT: bu yerda tezlik cheklovi (limit_req) ATAYLAB YO'Q.
    # LiveKit signalling darsning butun davomida tez-tez xabar almashadi
    # (sifat o'zgarishi, obuna yangilanishi). Cheklov qo'yilsa — video
    # tasodifiy uzilib turadi va sababini topish juda qiyin bo'ladi.

    location / {
        proxy_pass http://zinnur_livekit;
        proxy_http_version 1.1;

        # WebSocket upgrade — LiveKit uchun HAYOTIY MUHIM.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dars 1 soatdan uzoq bo'lsa bu qiymatni oshiring.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;

        # Real vaqt: buferlash mutlaqo mumkin emas.
        proxy_buffering off;
        proxy_cache     off;
        proxy_request_buffering off;
    }
}


# =============================================================================
#  7. MUHIM ESLATMALAR (o'qing — vaqtingizni tejaydi)
# =============================================================================
#
#  7.1  MEDIA TRAFIGI NGINX'DAN O'TMAYDI!
#       Bu fayl faqat SIGNALLING (WebSocket/HTTP) ni boshqaradi.
#       Haqiqiy video/audio to'g'ridan-to'g'ri quyidagi portlarga boradi:
#           UDP 7882  (asosiy yo'l — barcha media)
#           TCP 7881  (UDP to'silganda zaxira)
#           UDP 3478  (TURN rele)
#       Bu portlar FIREWALL'da OCHIQ bo'lishi SHART. Ular nginx bilan
#       hech qanday aloqasi yo'q — nginx ularni ko'rmaydi ham.
#       "Sahifa ochiladi, lekin video yo'q" muammosining 90% sababi shu.
#
#  7.2  TURN/TLS (5349) UCHUN `stream` BLOKI KERAK
#       TURN over TLS — bu HTTP EMAS, shuning uchun bu faylga sig'maydi.
#       Uni LiveKit'ning o'zi ushlagani eng sodda yo'l
#       (infra/livekit/livekit.yaml, 5-bo'limdagi PROD bloki).
#       Agar nginx orqali o'tkazmoqchi bo'lsangiz — `stream { }` bloki
#       `http { }` dan TASHQARIDA, /etc/nginx/nginx.conf da bo'lishi kerak:
#
#           stream {
#               upstream livekit_turn { server 127.0.0.1:5349; }
#               server {
#                   listen 5349 ssl;
#                   ssl_certificate     /etc/letsencrypt/live/livekit.zinnuronline.uz/fullchain.pem;
#                   ssl_certificate_key /etc/letsencrypt/live/livekit.zinnuronline.uz/privkey.pem;
#                   proxy_pass livekit_turn;
#               }
#           }
#
#  7.3  HOST NGINX SOZLAMALARI (/etc/nginx/nginx.conf)
#       200 foydalanuvchi uchun standart qiymatlar YETMAYDI:
#           worker_processes     auto;
#           worker_rlimit_nofile 65535;
#           events { worker_connections 8192; multi_accept on; }
#       Har WebSocket = 2 ta ochiq fayl deskriptori (klient + upstream).
#       200 foydalanuvchi x 2 (SignalR + LiveKit) x 2 = ~800 deskriptor,
#       ustiga oddiy HTTP so'rovlar. Standart 1024 juda tez tugaydi.
#
#       systemd chegarasini ham oshiring:
#           sudo systemctl edit nginx
#           [Service]
#           LimitNOFILE=65535
#
#  7.4  TEKSHIRUV RO'YXATI (deploy'dan keyin)
#       nginx -t                                    # sintaksis
#       curl -I https://zinnuronline.uz                   # 200 + HSTS sarlavhasi
#       curl -I https://zinnuronline.uz/api/v1/health     # backend tirikmi
#       curl -I https://livekit.zinnuronline.uz           # LiveKit javob beryaptimi
#       # WebSocket tekshiruvi:
#       curl -i -N -H "Connection: Upgrade" -H "Upgrade: websocket" \
#            -H "Sec-WebSocket-Version: 13" -H "Sec-WebSocket-Key: dGVzdA==" \
#            https://zinnuronline.uz/hubs/live
#       # Kutilgan javob: HTTP/1.1 101 Switching Protocols
#
#  7.5  FAYL YUKLASH VA VIDEO OQIMINI TEKSHIRISH (5.2-bo'lim)
#       Bu ikki tekshiruv nginx chegaralarini backend chegaralaridan
#       AJRATIB ko'rsatadi: 413 nginx'dan kelsa javob HTML bo'ladi va
#       `Server: nginx` dan boshqa hech narsa bo'lmaydi; backend 413 si esa
#       JSON (ProblemDetails) qaytaradi.
#
#       # (a) Chegara yuklash yo'lida KO'TARILGANMI (10 MB dan katta tana):
#       head -c 20000000 /dev/urandom > /tmp/20mb.bin
#       curl -s -o /dev/null -w '%{http_code}\n' -X POST \
#            -H "Authorization: Bearer $TOKEN" \
#            -F file=@/tmp/20mb.bin \
#            https://zinnuronline.uz/api/v1/lessons/1/assets
#       # 413 BO'LMASLIGI kerak (200/400/403 — backend qaroriga qarab)
#
#       # (b) Boshqa API yo'llarida chegara SAQLANGANMI (bu 413 BO'LISHI shart):
#       curl -s -o /dev/null -w '%{http_code}\n' -X POST \
#            --data-binary @/tmp/20mb.bin -H 'Content-Type: application/json' \
#            https://zinnuronline.uz/api/v1/auth/login
#       # Kutilgan: 413
#
#       # (c) `Range` -> 206 + `Content-Range` (video seek shunga tayanadi):
#       curl -s -D - -o /dev/null -H "Authorization: Bearer $TOKEN" \
#            -H 'Range: bytes=100-199' \
#            https://zinnuronline.uz/api/v1/lessons/assets/1 | head -20
#       # Kutilgan: HTTP/1.1 206, `Content-Range: bytes 100-199/<TOTAL>`,
#       #           `Accept-Ranges: bytes`, `Content-Encoding` BO'LMASLIGI
#
#       # (d) Yuklash DISKKA buferlanmayotganini ko'rish (sekin yuklash
#       #     davomida temp fayllar papkasi BO'SH turishi kerak):
#       watch -n1 'ls -l /var/lib/nginx/body 2>/dev/null || \
#                  ls -l /var/lib/nginx/client_body_temp'
# =============================================================================
