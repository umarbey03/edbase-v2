# =============================================================================
#  ZIN-NUR v2 — 443-PORTNI HTTPS VA TURN/TLS O'RTASIDA BO'LISH (SNI)
#  (2026-10-31, livekit-review 1-risk, P0)
# =============================================================================
#
#  🔴 BU FAYL SHABLON VA IXTIYORIY. U `conf.d/` GA TUSHMAYDI (u yerda
#     `http { }` konteksti — `stream { }` u yerda ISHLAMAYDI).
#
#  NIMA UCHUN KERAK. UDP ni bloklaydigan yoki faqat 443/TCP ni o'tkazadigan
#  tarmoqlarda (korporativ Wi-Fi, ba'zi mobil operatorlar, jamoat Wi-Fi)
#  LiveKit media'si faqat TCP 7881 ga qoladi, u ham yopiq bo'lsa — "xona
#  ochildi, lekin ovoz yo'q". TURN/TLS 443 bunday tarmoqdan oddiy HTTPS
#  bo'lib o'tadi.
#
#  QANDAY ISHLAYDI:
#
#      klient --443/TLS--> nginx stream (ssl_preread: SNI ni o'qiydi, TLS ni OCHMAYDI)
#          SNI = TURN domeni --> 127.0.0.1:5350  nginx TLS ni ochadi
#                                     --> 127.0.0.1:5349 LiveKit TURN (ochiq TCP,
#                                         `external_tls: true`)
#          boshqa hamma SNI   --> 127.0.0.1:8443  zinnur.conf (HTTPS, o'zgarishsiz)
#
#  ★ NIMA UCHUN `proxy_protocol`: 443 ni stream ushlagach, HTTPS serverlari
#    mijozni 127.0.0.1 deb ko'radi — `limit_req` (login, API) HAMMA
#    foydalanuvchini BITTA IP deb sanab, butun saytni bloklab qo'yardi.
#    PROXY sarlavhasi haqiqiy IP ni yetkazadi (`real_ip_header proxy_protocol`).
#    TURN tomoni ham uni qabul qiladi (5350 dagi `listen ... proxy_protocol`),
#    lekin LiveKit'ga OCHIQ TCP sifatida o'tkazadi — LiveKit PROXY
#    sarlavhasini tushunmaydi.
#
#  ★ NIMA UCHUN TLS NI NGINX OCHADI (LiveKit emas): sertifikat yangilanishi
#    allaqachon nginx reload'i bilan bog'langan (DEPLOY_UBUNTU 4.4 deploy
#    hook). LiveKit TLS ni o'zi ochsa, yangilangan sertifikatni ko'rishi uchun
#    LiveKit'ni qayta ishga tushirish kerak bo'lardi — bu JONLI DARSLARNI UZADI.
#
#  O'RNATISH (to'liq tartib: docs/DEPLOY_UBUNTU.md, 11.3):
#
#      set -a; . ./.env; set +a          # TURN_DOMAIN o'qiladi
#      sed "s|__TURN_DOMAIN__|${TURN_DOMAIN}|g" infra/nginx/zinnur-stream.conf \
#          | sudo tee /etc/nginx/zinnur-stream.conf >/dev/null
#      # /etc/nginx/nginx.conf ning ENG YUQORI darajasiga (http { } dan
#      # TASHQARIGA) bitta qator:
#      #     include /etc/nginx/zinnur-stream.conf;
#      # + zinnur.conf dagi IKKALA `listen 443` blokini 8443 ga o'tkazish
#      #   (o'sha fayldagi "TURN/443 REJIMI" izohlari).
#      sudo nginx -t && sudo systemctl reload nginx
#
#  ⚠️ `nginx -t` 443 "address already in use" desa — zinnur.conf dagi
#     `listen 443` lar hali 8443 ga o'tkazilmagan. Bu XAVFSIZ yiqilish:
#     reload bo'lmaydi va eski konfiguratsiya ishlayveradi.
#
#  ORQAGA QAYTISH: nginx.conf dagi `include` qatorini o'chirish va
#  zinnur.conf listen'larini qaytarish, `nginx -t && reload`. LiveKit tomoni
#  `.env` dan `TURN_DOMAIN` ni o'chirib `deploy.sh` (TURN/TLS o'chadi).
# =============================================================================

stream {
    # SNI -> ichki manzil. Faqat IP:port — `resolver` shart emas.
    map $ssl_preread_server_name $zinnur_443_upstream {
        __TURN_DOMAIN__     127.0.0.1:5350;
        default             127.0.0.1:8443;
    }

    server {
        listen      443;
        listen      [::]:443;

        ssl_preread on;
        proxy_pass  $zinnur_443_upstream;

        # Haqiqiy mijoz IP'si ichki serverlarga (izoh yuqorida).
        proxy_protocol on;

        proxy_connect_timeout 5s;

        # Ikki yo'nalishda ham shu muddat jim tursa ulanish yopiladi. SignalR va
        # LiveKit WebSocket'lari har ~15-30 s ping yuboradi, TURN esa uzluksiz
        # media — ya'ni 10 daqiqa faqat "o'lik" ulanishni yopadi.
        proxy_timeout 10m;
    }

    # TURN/TLS: TLS shu yerda ochiladi, LiveKit'ga ochiq TURN/TCP ketadi.
    server {
        listen      127.0.0.1:5350 ssl proxy_protocol;

        ssl_certificate     /etc/letsencrypt/live/__TURN_DOMAIN__/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/__TURN_DOMAIN__/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:zinnur_turn:5m;

        # `infra/livekit/livekit.prod.yaml` -> turn.tls_port (external_tls: true).
        proxy_pass  127.0.0.1:5349;

        proxy_connect_timeout 5s;
        proxy_timeout 10m;
    }
}
