# =============================================================================
#  ZIN-NUR v2 — kernel tuning drop-in
#  Manzil (prod): /etc/sysctl.d/99-zinnur.conf
#  Qo'llash:      sudo sysctl --system
#  Mo'ljal:       Ubuntu 24.04 LTS, 8 vCPU / 16 GB RAM, 200+ bir vaqtdagi
#                 o'quvchi, self-hosted LiveKit (UDP mux 7882).
#
#  QOIDA: bu yerdagi hech bir qiymat "sehrli" emas. Har biri ostida NEGA
#  kerakligi yozilgan. Agar server boshqa RAM/NIC bilan bo'lsa — izohdagi
#  formulaga qarab qayta hisoblang.
#
#  DIQQAT: `-` bilan boshlangan kalitlar — modul yuklanmagan bo'lsa
#  `sysctl --system` xato bermasin uchun (bu sysctl'ning rasmiy sintaksisi).
# =============================================================================


# -----------------------------------------------------------------------------
# 1. UDP SOKET BUFERLARI  —  ENG MUHIM QISM (LiveKit media)
# -----------------------------------------------------------------------------
# LiveKit'ning barcha media trafigi BITTA UDP portdan (7882, UDP mux) o'tadi.
# Ya'ni 200 o'quvchining hamma RTP paketlari bitta soketning receive queue'siga
# tushadi. Ubuntu'da default `net.core.rmem_max` ~208 KB — bu 200 ta abonent
# uchun juda kichik. Queue to'lganda kernel paketni JIMGINA tashlab yuboradi
# (drop), natijada: video "sinadi", ovoz uziladi, LiveKit loglarida
# "failed to sufficiently increase receive buffer size" ogohlantirishi chiqadi.
#
# *_max — bu shunchaki SHIFT (ceiling). Dastur `setsockopt(SO_RCVBUF)` bilan
# so'ramaguncha xotira sarflanmaydi. Pion/LiveKit aynan shuni so'raydi, shuning
# uchun 16 MB qo'yish xavfsiz.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# *_default — soket ochilganda beriladigan BOSHLANG'ICH hajm. Bu HAR BIR
# soketga ta'sir qiladi (postgres, redis, nginx, ssh — hammasi). Shuning uchun
# uni 16 MB qilib qo'ymaymiz, aks holda minglab soket = ortiqcha RAM.
# 1 MB — xavfsiz va yetarli oraliq.
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# Har bir UDP soket uchun kafolatlangan minimal buffer (bayt). Tizim umumiy
# UDP xotira bosimi ostida bo'lsa ham, bu miqdordan pastga tushirilmaydi.
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# --- ixtiyoriy: net.ipv4.udp_mem ---
# Bu barcha UDP soketlari uchun UMUMIY xotira chegarasi va SAHIFALARDA
# (1 sahifa = 4096 bayt) o'lchanadi. Format: "low pressure high".
# Ubuntu uni RAM hajmiga qarab avtomatik hisoblaydi va 16 GB serverda default
# odatda yetarli. Avval borini ko'ring:
#     sysctl net.ipv4.udp_mem
# Agar `high` qiymati 1 000 000 sahifadan (≈4 GB) kam bo'lsa va
# `netstat -su | grep -i "receive buffer errors"` o'sib borsa — quyidagini
# yoqing (262144 sahifa = 1 GB, 524288 = 2 GB, 1048576 = 4 GB):
# net.ipv4.udp_mem = 262144 524288 1048576


# -----------------------------------------------------------------------------
# 2. TCP ULANISH NAVBATLARI (nginx, SignalR/WebSocket, LiveKit 7880/7881)
# -----------------------------------------------------------------------------
# Dars boshlanganda 200 ta o'quvchi 10-20 soniya ichida bir vaqtda ulanadi:
# TLS handshake + WebSocket upgrade + SignalR + LiveKit signaling. Bu "thundering
# herd". Navbatlar kichik bo'lsa — kernel SYN paketni tashlaydi, brauzer
# 1-3 sekund kutib qayta uradi, foydalanuvchi "sayt ochilmayapti" deydi.

# accept() navbati chuqurligi. nginx/Kestrel `listen(backlog)` ni shundan oladi.
# Default 4096 (yangi kernellarda) — biz aniq qilib qo'yamiz.
net.core.somaxconn = 4096

# Yarim ochiq (SYN_RECV) ulanishlar navbati.
net.ipv4.tcp_max_syn_backlog = 8192

# NIC'dan kelgan, lekin hali CPU qayta ishlamagan paketlar navbati.
# 1 Gbps+ NIC va yuqori paket tezligida (LiveKit = juda ko'p kichik paket)
# default 1000 kam.
net.core.netdev_max_backlog = 16384

# SYN flood himoyasi. Navbat to'lganda ham legitim ulanishni qabul qiladi.
net.ipv4.tcp_syncookies = 1


# -----------------------------------------------------------------------------
# 3. PORT DIAPAZONI VA TIME_WAIT
# -----------------------------------------------------------------------------
# Host nginx -> api/web/livekit konteynerlariga proxy qiladi. Har bir
# proxy ulanishi bitta ephemeral port yeydi. 200 foydalanuvchi + keep-alive
# yo'q so'rovlar => portlar tugab qolishi mumkin ("Cannot assign requested
# address"). Diapazonni kengaytiramiz: ~55k port.
net.ipv4.ip_local_port_range = 10240 65535

# FIN_WAIT_2 holatida qancha kutish (sekund). Default 60 — proxy uchun uzoq.
net.ipv4.tcp_fin_timeout = 15

# TIME_WAIT'dagi portni CHIQUVCHI (outbound) ulanish uchun qayta ishlatishga
# ruxsat. Faqat outbound'ga ta'sir qiladi va timestamp'lar bilan xavfsiz.
# ESLATMA: `tcp_tw_recycle` YO'Q — u NAT ortidagi klientlarni buzadi va
# zamonaviy kernellarda umuman olib tashlangan. Uni hech qachon qo'shmang.
net.ipv4.tcp_tw_reuse = 1

# Uzoq yashaydigan WebSocket (SignalR /hubs/live) ulanishlari uchun.
# Klient NAT/mobil tarmoq ortida "jimgina o'lsa", server buni 5 daqiqada
# sezadi va soketni tozalaydi (default 2 soat — 200 foydalanuvchida bu
# "arvoh" ulanishlar to'planishi degani).
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5

# Ulanish bir oz jim turgandan keyin congestion window'ni nolga tushirmaslik.
# WebSocket/HTTP keep-alive uchun sezilarli tezlik beradi.
net.ipv4.tcp_slow_start_after_idle = 0

# PMTU black hole'lardan himoya (ba'zi mobil operatorlarda muammo bo'ladi).
net.ipv4.tcp_mtu_probing = 1

# Zamonaviy qatorlash + BBR. Yo'qotishli (lossy) mobil tarmoqlarda TCP
# (signaling, sahifa, 7881 fallback) sezilarli yaxshiroq ishlaydi.
# Tekshirish: sysctl net.ipv4.tcp_congestion_control
# Agar "bbr" o'rnatilmasa: sudo modprobe tcp_bbr && sudo sysctl --system
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr


# -----------------------------------------------------------------------------
# 4. FAYL DESKRIPTORLARI (tizim darajasi)
# -----------------------------------------------------------------------------
# Har bir TCP/UDP soket = 1 fayl deskriptor. 200 o'quvchi x (WebSocket +
# LiveKit + HTTP) + postgres + redis => oson 20-40k. Tizim chegarasi past
# bo'lsa "too many open files" xatosi keladi va konteyner yangi ulanish
# qabul qilmay qo'yadi.
#
# MUHIM: bu FAQAT tizim darajasidagi chegara. Har bir JARAYON chegarasi
# alohida sozlanadi:
#   - /etc/security/limits.d/99-zinnur.conf   (interaktiv login sessiyalari)
#   - /etc/systemd/system/docker.service.d/override.conf  (dockerd o'zi)
#   - /etc/docker/daemon.json -> default-ulimits           (KONTEYNERLAR)
# Shell'da `ulimit -n` ni oshirish konteynerlarga UMUMAN ta'sir qilmaydi.
fs.file-max = 2097152

# Bitta jarayon so'ray oladigan maksimal FD soni (hard ulimit shifti).
fs.nr_open = 1048576

# Docker/nginx/Vite reload uchun inotify. Default instances=128 kam bo'lishi
# mumkin ko'p konteynerli hostda.
fs.inotify.max_user_instances = 1024
fs.inotify.max_user_watches = 524288


# -----------------------------------------------------------------------------
# 5. XOTIRA
# -----------------------------------------------------------------------------
# Swap — bu "qo'shimcha RAM" EMAS. Realtime media serverida jiddiy swap
# ishlatilishi = audio/video uzilishi. swappiness=10: kernel iloji boricha
# RAM'da ushlab tursin, swap faqat favqulodda holat uchun.
vm.swappiness = 10

# Redis `BGSAVE`/fork uchun rasmiy tavsiya. Overcommit o'chirilgan bo'lsa
# fork "Cannot allocate memory" bilan yiqiladi va Redis logga ogohlantirish
# yozadi. Persistence o'chirilgan bo'lsa ham zarari yo'q.
vm.overcommit_memory = 1

# Postgres/JVM-simon dasturlar uchun mmap sohalari chegarasi.
vm.max_map_count = 262144


# -----------------------------------------------------------------------------
# 6. CONNTRACK (Docker NAT)
# -----------------------------------------------------------------------------
# Docker port publishing = iptables DNAT => har bir oqim conntrack jadvalida
# yozuv oladi. Jadval to'lganda kernel `nf_conntrack: table full, dropping
# packet` yozadi va YANGI ulanishlar tushib qoladi — eng yomon holat dars
# boshida sodir bo'ladi.
# Tekshirish:  cat /proc/sys/net/netfilter/nf_conntrack_count
#              cat /proc/sys/net/netfilter/nf_conntrack_max
# Har bir yozuv ~300 bayt => 262144 yozuv ≈ 80 MB RAM. 16 GB serverda arzon.
-net.netfilter.nf_conntrack_max = 262144

# UDP oqimlari uchun timeout. LiveKit media oqimi doimiy bo'lgani uchun
# "stream" timeout'i muhim: qisqa bo'lsa, kichik pauzada NAT mapping
# yo'qoladi va media to'xtaydi.
-net.netfilter.nf_conntrack_udp_timeout = 60
-net.netfilter.nf_conntrack_udp_timeout_stream = 600


# -----------------------------------------------------------------------------
# 7. XAVFSIZLIK (arzon va foydali)
# -----------------------------------------------------------------------------
# Docker ishlashi uchun ip_forward YOQILGAN bo'lishi SHART — Docker uni
# o'zi yoqadi, biz shunchaki aniq qilib yozamiz (aks holda ba'zi cloud
# image'larda o'chirilgan holda qoladi va konteynerlar internetga chiqmaydi).
net.ipv4.ip_forward = 1

# Manba manzili soxtalashtirilgan (spoofed) paketlarni rad etish.
# ESLATMA: `strict` (=1) emas, `loose` (=2) — Docker'ning ko'p interfeysli
# marshrutlashini buzmasligi uchun.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# ICMP redirect'larni qabul qilmaslik / yubormaslik.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0

# Kernel pointer'larini loglarda yashirish.
kernel.kptr_restrict = 1

# =============================================================================
#  QO'LLASH VA TEKSHIRISH
#
#   sudo cp infra/scripts/sysctl-zinnur.conf /etc/sysctl.d/99-zinnur.conf
#   sudo sysctl --system
#
#  Har bir qiymatni ALOHIDA tekshiring (qo'llanmaning 5.3-bo'limiga qarang):
#   sysctl net.core.rmem_max            # -> 16777216
#   sysctl net.core.somaxconn           # -> 4096
#   sysctl net.ipv4.ip_local_port_range # -> 10240 65535
#   sysctl fs.file-max                  # -> 2097152
# =============================================================================
