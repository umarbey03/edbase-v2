# ZIN-NUR v2 — uzluksiz integratsiya (CI)
#
# NIMA UCHUN KERAK: eski tizimda birorta ham avtomatik tekshiruv yo'q edi va
# shuning uchun `NameError` (mavjud bo'lmagan o'zgaruvchi) va yo'q lug'at
# kaliti kabi buglar ishlab chiqarishga chiqib ketgan — ular eng oddiy
# smoke test bilan ham tutilardi.
#
# Bu liniya har PR va har push'da ishlaydi. Yashil bo'lmasa — merge yo'q.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

# Bir vaqtda bitta ishga tushirish: yangi push eskisini bekor qiladi
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "9.0.x"
  NODE_VERSION: "22"
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  # ==========================================================================
  # BACKEND — build + unit testlar
  # ==========================================================================
  backend:
    name: Backend (.NET 9)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # NuGet keshi — har ishga tushishda paketlarni qaytadan yuklamaslik uchun
      - name: NuGet keshi
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        working-directory: backend
        run: dotnet restore Zinnur.sln

      # MUHIM: `Directory.Build.props` da `TreatWarningsAsErrors=true`.
      # Ya'ni har qanday ogohlantirish build'ni yiqitadi — bu ataylab.
      - name: Build (ogohlantirish = xato)
        working-directory: backend
        run: dotnet build Zinnur.sln --no-restore -c Release

      - name: Unit testlar
        working-directory: backend
        run: |
          dotnet test Zinnur.sln \
            --no-build -c Release \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --filter "FullyQualifiedName!~IntegrationTests"

      - name: Test natijalarini saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/**/TestResults/**
          retention-days: 7

  # ==========================================================================
  # INTEGRATSIYA TESTLARI — haqiqiy Postgres + Redis bilan
  # ==========================================================================
  integration:
    name: Integratsiya (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zinnur
          POSTGRES_PASSWORD: zinnur
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zinnur"
          --health-interval 5s --health-timeout 5s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet keshi
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # ----------------------------------------------------------------------
      # MINIO — obyekt ombori (S3-mos), fayl testlari uchun.
      #
      # NIMA UCHUN `services:` BLOKIDA EMAS: GitHub Actions xizmat
      # konteyneriga BUYRUQ ARGUMENTI bera olmaydi, MinIO esa `server /data`
      # argumentisiz faqat yordam matnini chiqarib to'xtaydi. Shuning uchun
      # oddiy qadam sifatida ko'tariladi.
      #
      # NIMA UCHUN UMUMAN KERAK: `SubmissionFileStorageTests` SigV4 imzosini,
      # path-style URL'ni va oqim bilan o'qishni HAQIQIY ombor bilan
      # tekshiradi. Soxta ombor bularning hammasini "to'g'ri" deb qabul
      # qilardi — aynan shu joyda `host` sarlavhasidagi port yo'qligi bugi
      # tutilgan edi.
      # ----------------------------------------------------------------------
      - name: MinIO (fayl ombori)
        run: |
          docker run -d --name zinnur-ci-minio \
            -p 9010:9000 \
            -e MINIO_ROOT_USER=zinnur_dev_minio \
            -e MINIO_ROOT_PASSWORD=zinnur_dev_minio_secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9010/minio/health/live >/dev/null 2>&1 && break
            sleep 2
          done

          docker run --rm --network host \
            -e MC_HOST_zinnur=http://zinnur_dev_minio:zinnur_dev_minio_secret@localhost:9010 \
            minio/mc:RELEASE.2025-08-13T08-35-41Z \
            mb --ignore-existing zinnur/zinnur-dev

      - name: Integratsiya testlari
        working-directory: backend
        env:
          # ZinnurApiFactory SHU o'zgaruvchilarni o'qiydi. Qolgan sozlamalarni
          # (Jwt, LiveKit) factory o'zi `UseSetting` orqali beradi — shuning uchun
          # ular bu yerda takrorlanmaydi (DRY).
          #
          # `Database=postgres` — factory har test sinfi uchun O'Z bazasini
          # yaratadi va tugagach o'chiradi; bu esa ulanish uchun bosh baza.
          TEST_POSTGRES: "Host=localhost;Port=5432;Database=postgres;Username=zinnur;Password=zinnur"
          TEST_REDIS: "localhost:6379"

          # Ombor: `StorageBackedApiFactory` shu manzilni ishlatadi.
          # Kalitlar yuqoridagi konteyner bilan BIR XIL bo'lishi shart.
          TEST_STORAGE_URL: "http://localhost:9010"
          TEST_STORAGE_BUCKET: "zinnur-dev"
          TEST_STORAGE_ACCESS_KEY: "zinnur_dev_minio"
          TEST_STORAGE_SECRET_KEY: "zinnur_dev_minio_secret"
        run: |
          if ls tests/Zinnur.IntegrationTests/*.csproj >/dev/null 2>&1; then
            dotnet test tests/Zinnur.IntegrationTests/Zinnur.IntegrationTests.csproj -c Release
          else
            echo "::warning::Integratsiya testlari hali yozilmagan (Faza 1.2)"
          fi

  # ==========================================================================
  # FRONTEND — tip tekshiruvi + build
  # ==========================================================================
  frontend:
    name: Frontend (Vue 3 + TS)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: O'rnatish
        working-directory: frontend
        run: npm ci

      # Tip xatolari build'dan OLDIN tutilsin
      - name: Tip tekshiruvi
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build
        working-directory: frontend
        run: npm run build

  # ==========================================================================
  # DOCKER — compose fayllari to'g'riligi
  # ==========================================================================
  docker:
    name: Docker konfiguratsiyasi
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: .env tayyorlash
        run: cp .env.example .env

      - name: dev compose tekshiruvi
        run: docker compose -f docker-compose.yml config --quiet

      - name: prod compose tekshiruvi
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      # ----------------------------------------------------------------------
      # RESURS CHEGARALARI DARVOZASI (2026-08-22 auditi)
      #
      # NIMA UCHUN KERAK: yuqoridagi `config --quiet` faqat YAML sintaksisini
      # tekshiradi. U qiymat MA'NOSINI bilmaydi — `POSTGRES_MEM=1G` bo'lib,
      # ichkarida `shared_buffers=2GB` turgan holat ham u uchun "to'g'ri".
      # Audit aynan shu holatni topdi: compose standartlari loyihaning O'Z
      # deploy hujjatiga (docs/DEPLOY_UBUNTU.md 6.1/6.2) zid edi va bu
      # o'zgaruvchilarning birortasi ham `.env.example` da yo'q edi.
      #
      # NEGA BOSHQA HECH NARSA BUNI TUTMAYDI: nomuvofiqlik faqat YUK OSTIDA
      # chiqadi. Postgres ishga tushishda yiqilmaydi (shared_buffers sahifasi
      # tegilganda ajratiladi), ya'ni `up -d`, healthcheck va smoke test —
      # hammasi yashil bo'ladi. Portlash haqiqiy dars paytida, OOM-killer
      # bitta backend'ni olganda sodir bo'ladi.
      #
      # Skript uchta manbani solishtiradi: DEPLOY_UBUNTU.md 6.1/6.2 jadvallari
      # (haqiqat manbasi), docker-compose.prod.yml standartlari va
      # .env.example. Farq bo'lsa — CI QIZIL. Qiymatni ataylab o'zgartirish
      # uchun avval hujjat jadvali yangilanadi.
      # ----------------------------------------------------------------------
      - name: Resurs chegaralari darvozasi (compose == .env.example == 6.1/6.2)
        run: ./infra/scripts/check-resource-limits.sh -v

      # Skriptlar sintaksisi (server-setup.sh, backup-db.sh)
      - name: Shell skriptlar sintaksisi
        run: |
          for f in infra/scripts/*.sh; do
            [ -f "$f" ] && bash -n "$f" && echo "ok $f"
          done
