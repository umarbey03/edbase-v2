# =============================================================================
#  ZIN-NUR v2 — FRONTEND KONTEYNERI ICHIDAGI NGINX
# =============================================================================
#
#  DIQQAT — ADASHTIRMANG, loyihada IKKITA nginx bor:
#
#   1) SHU FAYL (frontend/nginx.conf) — KONTEYNER ichida, 80-portda.
#      Vazifasi: Vue SPA ning statik fayllarini tarqatish. TLS YO'Q,
#      proxy YO'Q, domen bilmaydi. U shunchaki "fayl beruvchi".
#
#   2) infra/nginx/zinnur.conf — HOST mashinasida (Docker'dan tashqarida).
#      Vazifasi: TLS terminatsiya, domen, /api/ va /hubs/ ni backend'ga
#      yo'naltirish, WebSocket. U SHU konteynerga murojaat qiladi.
#
#  Ya'ni oqim:  Brauzer -> host nginx (443, TLS) -> web konteyner (80) -> fayl
#
#  Bu fayl /etc/nginx/nginx.conf ni TO'LIQ almashtiradi (server bloki emas,
#  butun konfiguratsiya). Shu sababli worker sozlamalari ham shu yerda.
# =============================================================================

# Ishchi jarayonlar `nginx` foydalanuvchisi nomidan ishlaydi (root EMAS).
user nginx;

# auto = mavjud CPU yadrolari soni. Statik fayl tarqatish uchun eng to'g'ri
# qiymat: har yadro o'z jarayonini oladi, kontekst almashinuvi minimal.
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

# Bitta ishchi jarayon ocha oladigan fayllar (soketlar ham fayl hisoblanadi).
# 200 foydalanuvchi uchun MUHIM: har brauzer bir nechta parallel ulanish
# ochadi. Standart chegara (1024) yetmay qolishi mumkin.
worker_rlimit_nofile 8192;

events {
    # Bitta ishchi jarayon bir vaqtda nechta ulanishni ushlab tura oladi.
    # 200 foydalanuvchi x ~6 parallel ulanish = 1200. 4 yadroli mashinada
    # 4 x 4096 = 16384 — katta zaxira bilan yetadi.
    worker_connections 4096;

    # Bitta `accept()` chaqirig'ida imkon qadar ko'p yangi ulanishni qabul
    # qilish. Dars boshlanganda 200 talaba bir vaqtda sahifani ochadi —
    # aynan shunday "portlash" holatida foydali.
    multi_accept on;
}

http {
    # MIME turlari: JS `application/javascript`, CSS `text/css` bo'lishi
    # SHART. Aks holda brauzer ES-modullarni bajarishdan BOSH TORTADI
    # ("Failed to load module script" xatosi) va sahifa oq qoladi.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Loglar ---
    # Statik fayl uchun har so'rovni yozish diskni behuda band qiladi.
    # Xatolar baribir error_log ga tushadi. Kerak bo'lsa `on` qiling.
    access_log off;

    # --- Fayl uzatish optimallashtirishlari ---
    # sendfile: fayl diskdan to'g'ridan-to'g'ri soketga ko'chiriladi,
    # foydalanuvchi xotirasiga nusxalanmaydi (zero-copy). Statik
    # tarqatishda eng katta samara beradigan bitta sozlama.
    sendfile on;

    # tcp_nopush: sendfile bilan birga — javob paketlarini to'ldirib
    # yuboradi, ya'ni yarim bo'sh paketlar ketmaydi.
    tcp_nopush on;

    # tcp_nodelay: keep-alive ulanishlarda Nagle algoritmini o'chiradi.
    # Kichik javoblar (masalan index.html) darrov jo'natiladi, 40 ms
    # kutib turmaydi.
    tcp_nodelay on;

    # --- Keep-alive ---
    # Ulanishni ochiq saqlash: SPA bitta sahifada o'nlab fayl so'raydi,
    # har biri uchun yangi TCP+TLS ochish juda qimmat.
    keepalive_timeout  65;
    keepalive_requests 1000;

    # Server nomini/versiyasini javob sarlavhasida yashirish.
    # Ma'lum versiyaga qarshi avtomatik hujumlarni qiyinlashtiradi.
    server_tokens off;

    # Yuklanadigan fayl hajmi. Bu nginx faqat statika beradi, hech narsa
    # QABUL QILMAYDI — kichik chegara qo'yamiz (himoya).
    client_max_body_size 2m;

    # =========================================================================
    #  SIQISH (COMPRESSION)
    # =========================================================================
    #  200 foydalanuvchi uchun bevosita muhim: Vue bundle odatda 300-800 KB.
    #  Gzip bilan ~100-200 KB. Dars boshlanishida 200 kishi bir vaqtda
    #  yuklaganda bu 160 MB va 40 MB o'rtasidagi farq — kanal to'lib
    #  qolishining oldini oladi.
    # =========================================================================
    gzip on;

    # 1 KB dan kichik fayllarni siqish foydasiz: siqilgan hajm ba'zan
    # kattaroq chiqadi, protsessor esa behuda ishlaydi.
    gzip_min_length 1024;

    # 1-9. Daraja 6 — sanoat standarti: hajm/CPU nisbati eng maqbul.
    # 9 qilish hajmni ~2% kamaytiradi, CPU'ni esa ~3 barobar oshiradi.
    gzip_comp_level 6;

    # Proksi ortidagi klientlar uchun ham siqish (host nginx bor).
    gzip_proxied any;

    # Kesh/proksilar siqilgan va siqilmagan variantlarni ADASHTIRMASIN.
    gzip_vary on;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;
    # DIQQAT: ro'yxatda `image/png`, `image/jpeg`, `woff2` uchun qayta siqish
    # YO'Q — ular allaqachon siqilgan, qayta siqish faqat CPU sarflaydi.

    # --- OLDINDAN SIQILGAN FAYLLAR ---
    # Vite `dist/` ichiga app.js.gz ham yaratsa (masalan vite-plugin-compression),
    # nginx uni QAYTA SIQMASDAN, tayyor holda beradi. CPU nolga yaqin sarflanadi.
    # Fayl bo'lmasa — oddiy gzip ishlaydi, hech narsa buzilmaydi.
    gzip_static on;

    # =========================================================================
    #  BROTLI — TAYYORGARLIK (hozircha o'chiq)
    # =========================================================================
    #  Brotli gzip'dan ~15-20% yaxshiroq siqadi va barcha zamonaviy
    #  brauzerlar qo'llab-quvvatlaydi.
    #
    #  NEGA HOZIR YOQILMAGAN: rasmiy `nginx:alpine` image'ida ngx_brotli
    #  moduli YO'Q. Yoqilgan direktiva noma'lum bo'lsa nginx UMUMAN
    #  ISHGA TUSHMAYDI ("unknown directive brotli") — ya'ni frontend butunlay
    #  yotadi. Shuning uchun ataylab izohda turibdi.
    #
    #  YOQISH UCHUN (ikki yo'ldan biri):
    #   A) Dockerfile'dagi runtime image'ni brotli bor variantga almashtiring:
    #        FROM fholzer/nginx-brotli:latest AS runtime
    #   B) yoki nginx'ni modul bilan o'zingiz yig'ing va yuqoriga qo'shing:
    #        load_module modules/ngx_http_brotli_filter_module.so;
    #        load_module modules/ngx_http_brotli_static_module.so;
    #
    #  Keyin quyidagi uch qatorni izohdan chiqaring:
    #
    #  brotli            on;
    #  brotli_comp_level 5;
    #  brotli_types      text/plain text/css application/javascript
    #                    application/json image/svg+xml application/manifest+json;
    #  brotli_static     on;      # tayyor .br fayllarni berish
    # =========================================================================

    # =========================================================================
    #  SERVER
    # =========================================================================
    server {
        listen      80;
        listen      [::]:80;
        server_name _;   # domen host nginx darajasida hal qilinadi

        root  /usr/share/nginx/html;
        index index.html;

        # Yashirin fayllarni (.env, .git va h.k.) berishni to'sish.
        # Ular bu yerda bo'lmasligi kerak, lekin himoya qatlami zarar qilmaydi.
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # =====================================================================
        #  1. HASH'LI AKTIVLAR — UZOQ MUDDATLI KESH
        # =====================================================================
        #  Vite fayl nomiga tarkib hash'ini qo'shadi: `index.4f2c9a1b.js`.
        #  Ya'ni FAYL TARKIBI O'ZGARSA — NOMI HAM O'ZGARADI.
        #  Demak eski nomni "abadiy" keshlash MUTLAQO XAVFSIZ.
        #
        #  200 foydalanuvchi uchun ta'siri katta: ikkinchi marta kirganda
        #  brauzer serverdan HECH NARSA so'ramaydi (hatto 304 ham emas).
        #  Dars boshlanishidagi yuk deyarli nolga tushadi.
        #
        #  immutable: brauzerga "bu fayl HECH QACHON o'zgarmaydi" deydi —
        #  foydalanuvchi F5 bosganda ham qayta so'ramaydi.
        # =====================================================================
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;

            # Fayl topilmasa — SPA fallback'ga TUSHMASIN.
            # Aks holda yo'q .js fayl o'rniga index.html qaytadi va brauzer
            # "Unexpected token '<'" degan chalg'ituvchi xato beradi.
            # To'g'ri javob — halol 404.
            try_files $uri =404;
        }

        # Shriftlar va rasmlar (Vite ularni ham hash bilan chiqaradi).
        location ~* \.(?:woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # =====================================================================
        #  2. index.html — KESHLASH QAT'IY TAQIQLANADI
        # =====================================================================
        #  index.html hash'li fayllarga HAVOLALARNI saqlaydi. U keshlansa,
        #  foydalanuvchi yangi versiyani chiqarganingizdan keyin ham
        #  ESKI index.html ni oladi -> u ESKI .js fayllarni so'raydi ->
        #  ular endi mavjud emas -> OQ EKRAN.
        #
        #  Bu — SPA deploy'idagi ENG KO'P uchraydigan xato.
        #  Shuning uchun: hech qachon keshlamaymiz.
        # =====================================================================
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires -1;
        }

        # =====================================================================
        #  3. SPA FALLBACK — Vue Router uchun HAL QILUVCHI QATOR
        # =====================================================================
        #  Muammo: foydalanuvchi to'g'ridan-to'g'ri /live/42 manzilini ochsa
        #  (yoki F5 bossa), nginx diskdan `/live/42` faylini qidiradi.
        #  Bunday fayl YO'Q -> 404 -> ilova ochilmaydi.
        #
        #  Yechim: fayl topilmasa index.html ni qaytaramiz. Vue Router
        #  brauzerda yuklanib, manzilni O'ZI ko'rib, kerakli sahifani chizadi.
        #
        #  try_files tartibi:
        #    $uri      -> aynan shu nomli fayl bormi?
        #    $uri/     -> shunday papka bormi (ichida index.html bilan)?
        #    /index.html -> ikkalasi ham yo'q => SPA ga topshiramiz
        # =====================================================================
        location / {
            try_files $uri $uri/ /index.html;

            # Bu blokka index.html ham tushadi (oxirgi fallback sifatida),
            # shuning uchun keshni bu yerda ham o'chiramiz.
            add_header Cache-Control "no-cache, no-store, must-revalidate";

            # --- Xavfsizlik sarlavhalari ---
            # To'liq to'plam (HSTS, CSP) HOST nginx'da — u TLS'ni ushlaydi
            # va barcha yo'llarni qamrab oladi. Bu yerdagilar — konteyner
            # to'g'ridan-to'g'ri ochib qo'yilgan holat uchun zaxira.
            #
            # nosniff: brauzer Content-Type ni "taxmin qilishga" urinmasin.
            add_header X-Content-Type-Options "nosniff" always;
            # Sahifani begona saytda <iframe> ichiga solishni taqiqlash
            # (clickjacking himoyasi).
            add_header X-Frame-Options "SAMEORIGIN" always;
            # Tashqi saytlarga to'liq manzilni oshkor qilmaslik.
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # =====================================================================
        #  4. KONTEYNER SOG'LIG'I
        # =====================================================================
        #  Dockerfile'dagi HEALTHCHECK va host nginx uchun yengil endpoint.
        #  Diskka murojaat qilmaydi — darrov javob beradi.
        # =====================================================================
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }
    }
}
