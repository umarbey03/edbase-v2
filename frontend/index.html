<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <!--
      BELGI — HAQIQIY BREND LOGOSI (2026-08-29).

      Ilgari bu yerda `favicon.svg` turardi: qo'lda yasalgan belgi, ichida
      xom hex bilan. U ikki marta noto'g'ri rangda qolib ketgan (v1 yashil
      -> indigo temaga ko'chirilmagan, keyin indigo -> zumradga). Endi
      brendning O'Z logosi qo'yildi, ya'ni tema o'zgarsa ham belgi
      brendga mos qolaveradi va uni qo'lda yangilash kerak emas.

      SVG YO'Q — ATAYLAB: logo gradientli rastr tasvir, uni SVG ga
      aylantirish sifatni yo'qotardi. Brauzerlar `image/png` ni bemalol
      qabul qiladi.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Ilova YORUG' temada. `class="dark"` va `color-scheme: dark` olib
      tashlandi: ular brauzerga forma boshqaruvlarini (select, checkbox,
      scrollbar) qorong'i chizishni buyurardi va yorug' sirtda ular
      "boshqa ilovadan" ko'rinardi. Jonli dars sahnasi o'zining to'q
      sirtini `[data-surface='stage']` orqali oladi (`src/style.css`).
    -->
    <meta name="color-scheme" content="light" />
    <!-- Mobil brauzer manzil paneli rangi — sahifa foni bilan bir xil (`ink-950`). -->
    <meta name="theme-color" content="#fbfaf8" />
    <meta
      name="description"
      content="ZIN-NUR ONLINE — 8 oylik to‘liq arab tili kursi: jonli darslar, kuratorlik va kitoblar uyingizgacha."
    />
    <!--
      Sarlavha — DOIMIY brend nomi (loyiha egasining talabi). Sabab va
      `router/index.ts` dagi juftligi o'sha faylning oxiridagi izohda.
    -->
    <title>ZIN-NUR ONLINE</title>
  </head>
  <body class="bg-ink-950 text-slate-100 antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
