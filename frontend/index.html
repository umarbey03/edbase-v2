<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Ilova YORUG' temada. `class="dark"` va `color-scheme: dark` olib
      tashlandi: ular brauzerga forma boshqaruvlarini (select, checkbox,
      scrollbar) qorong'i chizishni buyurardi va yorug' sirtda ular
      "boshqa ilovadan" ko'rinardi. Jonli dars sahnasi o'zining to'q
      sirtini `[data-surface='stage']` orqali oladi (`src/style.css`).
    -->
    <meta name="color-scheme" content="light" />
    <!-- Mobil brauzer manzil paneli rangi — sahifa foni bilan bir xil (`ink-950`). -->
    <meta name="theme-color" content="#f4f6fb" />
    <meta name="description" content="Zin-Nur — jonli video darslar platformasi" />
    <title>Zin-Nur — Jonli darslar</title>
  </head>
  <body class="bg-ink-950 text-slate-100 antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
