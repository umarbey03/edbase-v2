# =============================================================================
#  ZIN-NUR v2 — DEVELOPMENT (mahalliy ishlab chiqish)
# =============================================================================
#
#  ISHGA TUSHIRISH:
#      cp .env.example .env      # bir marta
#      docker compose build
#      docker compose up -d
#      docker compose logs -f api
#
#  PROD uchun bu fayl ISHLATILMAYDI — docker-compose.prod.yml MUSTAQIL fayl.
#  (Nega mustaqil — o'sha faylning boshidagi izohga qarang.)
#
#  Xizmat nomlari, portlar va tarmoq nomi SPEC 8-bo'limidan olingan.
#  ULAR SHARTNOMA — o'zgartirilmaydi.
# =============================================================================

# Loyiha nomi: konteyner/volume/tarmoq prefiksi shu bo'ladi (zinnur_*).
# Papka nomi o'zgarsa ham volume'lar YO'QOLMAYDI — mana shuning uchun qo'lda yozamiz.
# LOYIHA NOMI — eski loyiha (zinnur-legacy) bilan ARALASHMASLIGI uchun majburiy.
# Ikkalasi ham `zinnur` deb nomlanganda Docker ularni BITTA loyiha deb
# birlashtirgan va bir-birining konteynerlarini o'chirib yuborardi.
name: zinnur-v2
services:

  # ===========================================================================
  #  POSTGRESQL 17 — asosiy baza
  # ===========================================================================
  postgres:
    image: postgres:17-alpine
    container_name: zinnur-v2-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # initdb argumentlari FAQAT birinchi ishga tushishda (volume bo'sh bo'lsa)
      # qo'llanadi. Keyin o'zgartirish uchun volume'ni o'chirish kerak.
      # --locale=C + UTF8: eng tez va eng bashorat qilinadigan tartiblash.
      # Uzbek/kirill matnini saqlashga to'siq emas (UTF8 kodlash saqlaydi),
      # faqat ORDER BY tartibi bayt bo'yicha bo'ladi.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: ${TZ}

    # ---- 200 foydalanuvchi uchun sozlash --------------------------------------
    # max_connections=200: api'ning bitta nusxasi ~50 ulanish oladi
    # (POSTGRES_MAX_POOL_SIZE), qolgani migratsiya, psql, kelajakdagi 2-3 nusxa
    # uchun zaxira. Bundan KO'P qo'yish zararli: postgres har ulanishga alohida
    # OS process ochadi (~10 MB), 1000 ulanish = server o'ladi.
    #
    # shared_buffers=256MB: postgres o'z keshi. Odatiy qoida — RAM ning 25%.
    # Dev mashinada 256MB yetarli va noutbukni "yemaydi".
    #
    # max_wal_size: tez-tez CHECKPOINT bo'lishining oldini oladi. Dars boshlanishida
    # 200 ta Attendance yozuvi bir vaqtda kelganda checkpoint "to'lqini" bo'lmasin.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=256MB
      # Sekin so'rovlarni logga chiqarish (>500 ms). Dev'da N+1 muammosini
      # darrov ko'rsatadi — 200 foydalanuvchida N+1 = o'lim.
      - -c
      - log_min_duration_statement=500

    ports:
      # SPEC 8: host 5440 -> ichki 5432.
      # 5432 EMAS — mashinada boshqa postgres bo'lsa to'qnashmasin.
      - "5440:5432"

    volumes:
      # ATAYLAB nomlangan (named) volume: `docker compose down` da ham,
      # konteyner qayta yaratilganda ham ma'lumot QOLADI.
      # Butunlay tozalash: docker compose down -v (EHTIYOT BO'LING).
      - postgres-data:/var/lib/postgresql/data
      # SPEC 1-bo'limdagi infra/postgres papkasi. Ichidagi *.sql / *.sh fayllar
      # FAQAT birinchi initsializatsiyada, alifbo tartibida bajariladi.
      # Hozir bo'sh — sxemani EF Core migratsiyalari boshqaradi.
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro

    healthcheck:
      # -h 127.0.0.1 MAJBURIY: usiz pg_isready unix-socket orqali tekshiradi va
      # postgres TCP tinglashga ulgurmasdan turib "sog'lom" deb javob beradi —
      # keyin api "Connection refused" bilan qulaydi (klassik poyga holati).
      # $$ = compose interpolatsiyasidan qochish, o'zgaruvchini KONTEYNER ochsin.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks: [zinnur-v2-net]

  # ===========================================================================
  #  REDIS 7 — SignalR backplane + presence + rate-limit
  # ===========================================================================
  #  Redis bu loyihada KESH EMAS, balki HOLAT ombori:
  #    1) SignalR backplane (SPEC 6) — api'ning nusxalari o'rtasida xabar
  #    2) IPresenceService (SPEC 4)  — darsda kim borligi
  #    3) chat rate-limit (SPEC 6.2) — 1 xabar / 2 sekund
  #  Shu sababli ma'lumotni yo'qotib bo'lmaydi => appendonly + named volume.
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: zinnur-v2-redis
    restart: unless-stopped

    command:
      - redis-server
      # --- Bardoshlilik ---
      # appendonly yes: har yozuv AOF jurnaliga tushadi. Redis qayta ishga
      # tushsa presence va backplane holati tiklanadi.
      - --appendonly
      - "yes"
      # everysec: sekundiga bir marta diskka fsync. `always` juda sekin,
      # `no` esa 30 sekundgacha ma'lumot yo'qotadi. Oraliq — to'g'ri tanlov.
      - --appendfsync
      - everysec
      # --- RDB snapshot O'CHIRILGAN (bo'sh --save) ---
      # NEGA (200 foydalanuvchi uchun MUHIM): RDB snapshot `fork()` qiladi.
      # fork paytida Redis bir necha yuz millisekundga QOTADI. SignalR
      # backplane qotsa — 200 ta odamning chati va presence'i "muzlaydi".
      # AOF bizga yetarli bardoshlilikni fork'siz beradi.
      - --save
      - ""
      # --- Xotira ---
      # 512mb: 200 ta ishtirokchi presence + chat rate-limit kalitlari uchun
      # aslida ~20 MB yetadi; zaxira bilan olingan.
      - --maxmemory
      - 512mb
      # noeviction: XOTIRA TO'LSA ESKI KALITNI O'CHIRMAYDI, balki YOZUVNI RAD ETADI.
      # Bu ataylab: `allkeys-lru` bo'lsa Redis jimgina presence yozuvini o'chirib
      # yuboradi va davomat noto'g'ri hisoblanadi. Xato ochiq bo'lgani yaxshi.
      - --maxmemory-policy
      - noeviction

    ports:
      # SPEC 8: host 6390 -> ichki 6379. Prod'da BU QATOR YO'Q.
      - "6390:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      # `redis-cli ping` server javob bermasa ham 0 qaytarishi mumkin (ba'zi
      # xato holatlarida), shuning uchun javobni PONG ga solishtiramiz.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

    networks: [zinnur-v2-net]

  # ===========================================================================
  #  MINIO — obyekt ombori (S3-mos), FAQAT ISHLAB CHIQISH UCHUN
  # ===========================================================================
  #  NIMA UCHUN KERAK: o'quvchi vazifaga rasm/ovoz biriktiradi. Prod'da bu
  #  fayllar Cloudflare R2 da yotadi, lekin dev mashinada R2 yo'q — natijada
  #  fayl yuklash lokal muhitda UMUMAN sinab ko'rilmasdi va nosozlik faqat
  #  prod'da, haqiqiy o'quvchi javob topshirayotganda chiqardi.
  #
  #  NIMA UCHUN AYNAN MINIO: u R2 bilan BIR XIL protokolni (S3 + SigV4,
  #  path-style URL) gapiradi. Ya'ni `R2SubmissionStorage` ning AYNI kod
  #  yo'li dev'da ham, prod'da ham ishlaydi — o'zgaradigan narsa faqat
  #  `Storage:*` qiymatlari. "Dev uchun alohida fayl ombori" yozilganda esa
  #  ikki yo'l vaqt o'tib bir-biridan uzoqlashardi va dev'dagi yashil natija
  #  hech nimani isbotlamasdi.
  #
  #  PROD'DA BU XIZMAT ISHLAMAYDI — docker-compose.prod.yml uni o'chiradi
  #  va `Storage:*` ni R2 qiymatlari bilan QAYTA yozadi.
  # ===========================================================================
  minio:
    # Sana bilan PIN QILINGAN: `latest` bir kun ertalab jimgina yangilanib,
    # sabab ko'rsatmasdan buziladigan yagona narsa bo'lib qolardi.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: zinnur-v2-minio
    restart: unless-stopped

    # Image ENTRYPOINT'i faqat kirish nuqtasi; server buyrug'i shu yerda.
    command: ["server", "/data", "--console-address", ":9001"]

    environment:
      # Ildiz kaliti = api ishlatadigan `Storage:AccessKey`/`SecretKey`.
      # Bitta manbadan (.env) olinadi — mos kelmay qolib "SignatureDoesNotMatch"
      # bermasin (bu xatoni topish juda azob, chunki sabab ko'rinmaydi).
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
      TZ: ${TZ}

    ports:
      # 9010/9011 — 9000/9001 EMAS: mashinada boshqa loyihaning MinIO'si
      # (govori-minio) allaqachon 9000/9001 ni egallagan.
      #   9010 -> S3 API (imzolangan so'rovlar shu yerga tushadi)
      #   9011 -> veb konsol (brauzerda bucket'ni ko'rish uchun)
      - "9010:9000"
      - "9011:9001"

    volumes:
      - minio-data:/data

    healthcheck:
      # MinIO'ning o'z sog'liq yo'li. Image ichida `curl` bor.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks: [zinnur-v2-net]

  # ===========================================================================
  #  MINIO-INIT — bucket yaratadi va O'CHADI (bir martalik qadam)
  # ===========================================================================
  #  NEGA ALOHIDA KONTEYNER: MinIO bucket'ni o'zi yaratmaydi, api esa uni
  #  yaratmasligi KERAK — prod'da (R2) api'da bucket yaratish huquqi yo'q va
  #  bo'lmasligi ham kerak. Bucket — infratuzilma, kod emas.
  #
  #  `restart: "no"` — vazifa bajarilgach konteyner "Exited (0)" bo'lib qoladi,
  #  bu NORMAL holat.
  # ===========================================================================
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: zinnur-v2-minio-init
    restart: "no"

    depends_on:
      minio:
        condition: service_healthy

    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set zinnur http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "zinnur/$${STORAGE_BUCKET}"
        # ⚠️ ANONIM KIRISH ATAYLAB BERILMAYDI (`mc anonymous set download` YO'Q).
        # Eski tizimning X-6 kamchiligi aynan shu edi: `/media` katalogi
        # ochiq bo'lib, havolani bilgan har kim o'quvchining ishini ko'rardi.
        # Fayl FAQAT `GET /api/v1/submissions/files/{id}` orqali, ruxsat
        # tekshirilgandan keyin beriladi.
        mc anonymous set none "zinnur/$${STORAGE_BUCKET}" || true
        echo "minio: bucket '$${STORAGE_BUCKET}' tayyor (xususiy)"

    networks: [zinnur-v2-net]

  # ===========================================================================
  #  LIVEKIT — SFU (video/audio)
  # ===========================================================================
  #  Eng og'ir xizmat. 200 ishtirokchi uchun sozlash sirlari
  #  infra/livekit/livekit.yaml faylida batafsil izohlangan.
  # ===========================================================================
  livekit:
    # ══════════════════════════════════════════════════════════════════════
    # ⚠️ BU TEG `frontend/package.json` DAGI `livekit-client` BILAN JUFTLIK.
    #    Biri o'zgarsa — ikkinchisi ham TEKSHIRILISHI SHART.
    #
    #    Server v1.8.4 signalling protokoli 15 ni biladi. Shuning uchun klient
    #    ham AYNAN protokol 15 li versiyada qotirilgan: `livekit-client@2.11.4`
    #    — protokol 15 ni gapiradigan ENG OXIRGI livekit-client.
    #
    #    2026-07-31 da isbotlangan nosozlik (klient 2.21.0 = protokol 17):
    #      1) klient avval `/rtc/v1` ni so'raydi — bu yo'l v1.8.4 da YO'Q,
    #         WebSocket 1006 bilan yopiladi, klient eski `/rtc` ga tushadi;
    #      2) klient protokol 17 ga xos `_data_track` DataChannel'ini ochadi,
    #         server uni tanimaydi ("unsupported datachannel added");
    #      3) SDP kelishuvi (negotiation) TUGAMAYDI -> 15 sekunddan keyin
    #         `NegotiationError` -> TO'LIQ QAYTA ULANISH -> CHEKSIZ HALQA.
    #    Ko'rinishi o'zini YASHIRADI: xona ochiladi, ishtirokchilar ro'yxati
    #    to'ladi, LEKIN publisher bitta ham bayt yubormaydi
    #    (`outbound-rtp.bytesSent == 0`) va har 15 sekundda sahna nolga
    #    qaytadi — ya'ni "tugma bosilmayapti, kamera yoqilsa ham ko'rinmaydi".
    #
    #    SERVERNI YANGILASH bilan ham tuzatish mumkin edi (v1.13.5 protokol 17
    #    ni biladi), LEKIN u lokal ishlab chiqishni buzadi: v1.9+ ICE
    #    paketlarini faqat O'ZI E'LON QILGAN manzilga bog'langan soketda qabul
    #    qiladi, Docker Desktop (macOS) esa paketni konteynerning bridge
    #    IP'siga uzatadi — natijada `requestsReceived: 0` va ICE `checking` da
    #    qotib qoladi. Shuning uchun juftlik KLIENT tomonidan tenglashtirilgan.
    # ══════════════════════════════════════════════════════════════════════
    image: livekit/livekit-server:v1.13
    container_name: zinnur-v2-livekit
    restart: unless-stopped

    # Image'ning ENTRYPOINT'i `livekit-server`, shuning uchun bu yerda faqat
    # argumentlar. `--config` — mount qilingan yaml.
    # `--node-ip 127.0.0.1` — FAQAT LOKAL ISHLAB CHIQISH UCHUN.
    #
    # NIMA UCHUN KERAK: `livekit.yaml` da `use_external_ip: true` turadi —
    # bu PRODUCTION uchun to'g'ri. Lekin lokal mashinada LiveKit o'zining
    # OQ IP'sini (masalan 185.x.x.x) aniqlab, ICE nomzodlarida shuni
    # e'lon qiladi. Brauzer esa o'sha oq IP:7882 ga UDP yuborishga urinadi,
    # holbuki konteyner faqat `localhost:7882` orqali ochiq.
    #
    # Natija o'zini YASHIRADI: xona ochiladi, ishtirokchilar ro'yxati to'ladi,
    # lekin OVOZ VA VIDEO KELMAYDI. Bu self-hosted LiveKit'dagi eng ko'p
    # uchraydigan va topish qiyin nosozlik.
    #
    # `--node-ip` ni aniq ko'rsatib, avtomatik aniqlashni chetlab o'tamiz.
    # PRODUCTION'da bu YO'Q — u yerda `network_mode: host` ishlatiladi
    # (docker-compose.prod.yml) va server haqiqiy IP'sini o'zi ko'radi.
    command: ["--config", "/etc/livekit/livekit.yaml"]

    environment:
      # ---- KALITLAR ----
      # LiveKit konfiguratsiya faylida ${...} ni KENGAYTIRMAYDI (env
      # substitution YO'Q — yaml qanday yozilgan bo'lsa shunday o'qiydi).
      # Shuning uchun sir faylga EMAS, mana shu env orqali beriladi.
      # LIVEKIT_KEYS fayldagi `keys:` blokini BUTUNLAY almashtiradi.
      # Format qat'iy YAML: "<kalit>: <sir>" — ikki nuqtadan keyin PROBEL SHART.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"

      # ---- FAQAT LOKAL ISHLAB CHIQISH UCHUN ICE SOZLAMALARI ----
      #
      # MUAMMO: `livekit.yaml` PRODUCTION uchun `use_external_ip: true` bilan
      # yozilgan — server o'zining OQ IP'sini aniqlab, ICE nomzodlarida shuni
      # e'lon qilishi kerak. Lekin lokal mashinada bu NOTO'G'RI: LiveKit
      # oq IP'ni (masalan 185.x.x.x) e'lon qiladi, brauzer esa o'sha manzilga
      # UDP yuborishga urinadi, holbuki konteyner faqat `localhost:7882` da.
      #
      # Natija o'zini YASHIRADI — xona ochiladi, ishtirokchilar ro'yxati
      # to'ladi, lekin OVOZ VA VIDEO KELMAYDI. Bu self-hosted LiveKit'dagi
      # eng ko'p uchraydigan va topish qiyin nosozlik.
      #
      # ⚠️ DIQQAT — `LIVEKIT_RTC_*` KO'RINISHIDAGI ENV O'ZGARUVCHILARI YO'Q.
      # Ilgari bu yerda `LIVEKIT_RTC_USE_EXTERNAL_IP` va
      # `LIVEKIT_RTC_ENABLE_LOOPBACK_CANDIDATE` turardi va ular `livekit.yaml`
      # ni "dev uchun override qiladi" deb izohlangan edi. BU NOTO'G'RI:
      # livekit-server FAQAT quyidagi env o'zgaruvchilarini o'qiydi
      # (`livekit-server --help` bilan tekshirilgan, v1.8):
      #     LIVEKIT_CONFIG, LIVEKIT_KEYS, LIVEKIT_REGION,
      #     LIVEKIT_TURN_CERT, LIVEKIT_TURN_KEY, NODE_IP, UDP_PORT,
      #     REDIS_HOST, REDIS_PASSWORD
      # Boshqa nomlar JIMGINA E'TIBORSIZ QOLDIRILADI. Ya'ni o'sha ikki qator
      # HECH QACHON ishlamagan — ular faqat "sozlangan" degan yolg'on tuyg'u
      # bergan. Shuning uchun olib tashlandi: dev'da ICE manzilini boshqarish
      # uchun YAGONA haqiqiy dastak — `NODE_IP` (va kerak bo'lsa `UDP_PORT`).
      # `rtc.*` sozlamalari esa `infra/livekit/livekit.yaml` dan o'qiladi.
      #
      # PRODUCTION'da `NODE_IP` YO'Q — `docker-compose.prod.yml`
      # `network_mode: host` ishlatadi va server haqiqiy IP'sini o'zi ko'radi.
      #
      # ⚠️ macOS / Windows (Docker Desktop) UCHUN MUHIM ESLATMA:
      # Docker Desktop UDP paketini konteynerga uzatganda MANBA MANZILNI
      # ALMASHTIRADI (SNAT): brauzerning haqiqiy `10.x.x.x` manzili o'rniga
      # LiveKit ichkarida `192.168.65.1` (VM shlyuzi) ni ko'radi. Bu manzil
      # brauzer e'lon qilgan HECH QAYSI ICE nomzodiga mos kelmaydi, natijada
      # pion `udp_mux` paketni TASHLAYDI ("Dropping packet from ..."), server
      # javob bermaydi va ICE `checking` da abadiy qotadi
      # (`requestsReceived: 0`, `connectionType: "unknown"`, trek publish
      # bo'lmaydi). Bu KOD NOSOZLIGI EMAS — muhit cheklovi.
      # Agar media ulanmasa, quyidagilarni shu tartibda sinang:
      #   1) Docker Desktop'ni to'liq qayta ishga tushiring (UDP NAT holati
      #      buzilib, hatto SOXTA manba manzil ham qo'yishi kuzatilgan);
      #   2) `.env` ga LAN IP yozib ko'ring:
      #        LIVEKIT_DEV_NODE_IP=192.168.x.x   # ipconfig getifaddr en0
      #   3) Ishonchli yechim: LiveKit'ni lokalda Docker'SIZ, to'g'ridan-to'g'ri
      #      host'da ishga tushiring — o'shanda NAT qatlami umuman bo'lmaydi.
      # ══════════════════════════════════════════════════════════════════
      # ★ 2026-07-31 DA HAL QILINDI — yuqoridagi tashxis TO'LIQ EMAS EDI
      #
      # Haqiqiy ildiz sabab: server v1.8.4 SIGNALLING PROTOKOLI 15 ni,
      # `livekit-client` 2.21.0 esa 17 ni gapiradi. Klient `/rtc/v1` so'raydi
      # -> 404 -> eski `/rtc` ga tushadi -> publisher kelishuvi tasdiqlanmaydi
      # -> AYNAN 15.0 s dan keyin `NegotiationError` -> to'liq qayta ulanish.
      # Xona HECH NARSA BOSILMASA HAM har ~15 s da qayta ulanardi.
      #
      # Shundan kelib chiqqan uchta "alohida" nosozlik aslida bitta edi:
      #   • kamera tugmasi spinner'da qotardi (`publishTrack()` tugamasdi)
      #   • tugma "o'chiq" ko'rinardi (`isCameraEnabled` har ulanishda nolga)
      #   • mikrofon ~15 s ishlab, keyin o'chardi
      #
      # Yechim: serverni protokol 17 ni biladigan versiyaga ko'tarish.
      #
      # ══════════════════════════════════════════════════════════════════
      # 🔴 LOKALDA MEDIA (ovoz/video) SINOVI QO'LLAB-QUVVATLANMAYDI — ONGLI QAROR
      #
      # Signalling, chat, davomat, ishtirokchilar ro'yxati — hammasi lokalda
      # ISHLAYDI va sinaladi. Faqat MEDIA OQIMI sinalmaydi.
      #
      # Sabab (o'lchangan, taxmin emas):
      #   • Docker Desktop UDP paketining MANBA manzilini almashtiradi
      #     (`10.x` -> `192.168.65.1`), pion `udp_mux` esa uni hech qaysi ICE
      #     nomzodiga mos kelmagani uchun tashlaydi:
      #       "Dropping packet from ::ffff:192.168.65.1"  (bir yugurishda 644 ta)
      #   • `NODE_IP` bilan LAN IP berish ham yetmaydi: quyidagi
      #     `livekit.yaml` da `use_external_ip: true` turadi va u USTUN —
      #     LiveKit baribir OQ IP ni e'lon qiladi. Uni dev uchun o'chirish
      #     esa prod'ni buzadi (o'sha fayl ikkalasida ham ishlatiladi).
      #
      # ★ MAHSULOTGA TAALLUQLI EMAS: prod'da LiveKit `network_mode: host` da
      # ishlaydi — Docker NAT qatlami UMUMAN yo'q. Media shu sababli
      # PRODUCTION'da sinaladi.
      #
      # ⚠️ Prod'da `7882/udp` va `3478/udp` firewall'da OCHIQ bo'lishi SHART —
      # deploy'dagi eng ko'p uchraydigan xato aynan shu.
      # ══════════════════════════════════════════════════════════════════
      TZ: ${TZ}

    ports:
      # --- SPEC 8 dagi uchta port ---
      # 7880/tcp — signalling: WebSocket + REST API. Brauzer shu yerga ulanadi.
      - "7880:7880"
      # 7881/tcp — RTC/TCP zaxira. Qattiq korporativ firewall UDP'ni to'sganda
      # media shu port orqali o'tadi. Sekinroq, lekin "umuman ishlamaydi"dan yaxshi.
      - "7881:7881"
      # 7882/udp — RTC UDP MUX: BARCHA ishtirokchilarning butun media oqimi
      # SHU BITTA portdan o'tadi.
      # NEGA MUX (diapazon emas): 200 foydalanuvchi x N ta trek = minglab port
      # kerak bo'lardi. Docker esa har bir e'lon qilingan portga alohida
      # proxy process ochadi — 1000 port = server yotadi. Mux = 1 port = 1 socket.
      - "7882:7882/udp"
      # 3478/udp — TURN rele (infra/livekit/livekit.yaml, 5-bo'lim).
      # UDP 7882 ga umuman chiqa olmaydigan (qattiq firewall ortidagi)
      # foydalanuvchilar uchun zaxira yo'l.
      # Dev'da TURN/TLS o'chiq (tls_port: 0), shuning uchun 5349 porti YO'Q.
      - "3478:3478/udp"

    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
      # Nomlangan volume: hozircha LiveKit holatni Redis'da saqlaydi, lekin
      # keyinchalik yozib olish (egress/recording) yoqilganda fayllar shu yerga
      # tushadi. Oldindan tayyorlab qo'yamiz — keyin ma'lumot yo'qolmasin.
      - livekit-data:/data

    depends_on:
      # LiveKit ishga tushishi bilan Redis'ga ulanadi; Redis tayyor bo'lmasa
      # qayta-qayta urinib, loglarni axlat bilan to'ldiradi.
      redis:
        condition: service_healthy

    healthcheck:
      # LiveKit ildiz yo'lida (`/`) oddiy sog'liq javobini beradi.
      # Image alpine asosida — busybox wget mavjud, curl YO'Q.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7880/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks: [zinnur-v2-net]

  # ===========================================================================
  #  API — .NET 9 Web API + SignalR
  # ===========================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: zinnur/api:dev
    container_name: zinnur-v2-api
    restart: unless-stopped

    # env_file: .env dagi HAMMA o'zgaruvchi konteynerga tushadi.
    # Bu "qo'shimcha" narsalar (VITE_*, DOMAIN...) uchun zararsiz, lekin
    # yangi sozlama qo'shganda compose'ni tahrirlash shart emas — qulay.
    env_file:
      - .env

    # environment: env_file USTIDAN yozadi (ustunlik yuqori).
    # Bu yerda SPEC 8-bo'limidagi ANIQ `__` kalitlari yig'iladi.
    # `__` — .NET konfiguratsiyasida ichma-ich kalit ajratgichi
    # (ConnectionStrings__Postgres  ==  "ConnectionStrings:Postgres").
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # Konteyner ichida doim 8080. Host'ga 5080 orqali chiqadi.
      ASPNETCORE_URLS: http://+:8080

      # ---- Baza ----
      # Host=postgres — Docker ichki DNS: xizmat nomi = host nomi.
      # Maximum Pool Size — .env dagi izohga qarang (200 user != 200 ulanish).
      # Timeout=15 — baza ko'tarilmayotgan bo'lsa 15 sekundda ochiq xato bersin,
      # so'rov cheksiz osilib qolmasin.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-50};Timeout=15;Command Timeout=30"

      # ---- Redis ----
      # SPEC 8 dagi format: "host:port" (StackExchange.Redis sintaksisi).
      # abortConnect=false MUHIM: Redis bir lahza yo'q bo'lsa api ISHGA
      # TUSHMAY qolmasin, balki fonda qayta ulanaverisin.
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectTimeout=5000"

      # ---- JWT (o'z tokenlarimiz) ----
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__AccessMinutes: ${JWT_ACCESS_MINUTES}
      Jwt__RefreshDays: ${JWT_REFRESH_DAYS}

      # ---- LiveKit: IKKI ALOHIDA MANZIL ----
      # Url       -> ICHKI, server-server chaqiruvlar (xona boshqaruvi).
      #              Brauzerga hech qachon berilmaydi.
      # PublicUrl -> BRAUZERGA qaytariladi (LiveKitJoinDto.ServerUrl).
      #              Brauzer hal qila oladigan manzil bo'lishi SHART:
      #              dev'da ws://localhost:7880, prod'da wss://livekit.<domen>
      #              (`ws://livekit:7880` — Docker ichki DNS nomi, brauzer bilmaydi;
      #               prod'da HTTPS sahifadan ws:// mixed-content sifatida bloklanadi).
      LiveKit__Url: ${LIVEKIT_INTERNAL_URL}
      LiveKit__PublicUrl: ${LIVEKIT_PUBLIC_URL}
      LiveKit__ApiKey: ${LIVEKIT_API_KEY}
      LiveKit__ApiSecret: ${LIVEKIT_API_SECRET}

      # ---- CORS ----
      # .NET massivi: __0, __1, ... (SPEC 8).
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1}

      # ---- NAMUNAVIY (DEMO) MA'LUMOT --------------------------------------
      # `true` bo'lsa BO'SH bazaga to'liq namunaviy o'quv markazi yoziladi:
      # xodimlar, 12 o'quvchi, guruhlar, darslar, davomat, baholar, to'lovlar,
      # chat va yozuvlar. Tekshirish uchun kirish raqamlari LOGDA jadval
      # ko'rinishida chiqadi (`docker compose logs api | grep Namunaviy`).
      #
      # 🔴 STANDART QIYMAT — `false`, VA U ATAYLAB SHUNDAY. Yoqilgan holda
      # ham himoya bor: bazada 3 tadan ko'p foydalanuvchi bo'lsa seeder
      # ISHLAMAYDI va logga xato yozadi (ishlab turgan markazga soxta
      # o'quvchi tushmasin). Batafsil — `DemoDataSeeder` izohi.
      Seed__Demo: ${SEED_DEMO:-false}

      # ---- OBYEKT OMBORI (vazifa fayllari) --------------------------------
      # DEV: MinIO (yuqoridagi xizmat). PROD: Cloudflare R2 — qiymatlar
      # docker-compose.prod.yml da QAYTA yoziladi, chunki compose overlay'lari
      # `environment` ni BIRLASHTIRADI va bu qatorlar aks holda prod'ga ham
      # o'tib ketardi (LiveKit bilan bir marta shunday bo'lgan).
      #
      # ServiceUrl ICHKI docker DNS nomi — `http://minio:9000`. Host'dagi
      # 9010 porti EMAS: imzo (SigV4) HOST bilan bog'langan va konteyner
      # ichidan `localhost:9010` ga umuman chiqib bo'lmaydi.
      #
      # ⚠️ TO'RTTASI HAM bo'lishi yoki HECH QAYSISI bo'lmasligi kerak:
      # yarim to'ldirilgan `Storage:*` da ilova ATAYLAB ko'tarilmaydi
      # (`StorageOptions` + `ValidateOnStart`).
      Storage__ServiceUrl: ${STORAGE_SERVICE_URL}
      Storage__Bucket: ${STORAGE_BUCKET}
      Storage__AccessKey: ${STORAGE_ACCESS_KEY}
      Storage__SecretKey: ${STORAGE_SECRET_KEY}
      Storage__Region: ${STORAGE_REGION}
      Storage__KeyPrefix: ${STORAGE_KEY_PREFIX}

      # ⚠️ PublicUrl — BRAUZER ko'radigan manzil, ServiceUrl'dan ALOHIDA.
      #
      # NIMA UCHUN KERAK: dars yozuvi presigned havola bilan beriladi va uni
      # BRAUZER ochadi. `ServiceUrl` esa ichki docker DNS nomi (`minio:9000`) —
      # brauzerda u yechilmaydi. Bo'sh qoldirilsa `EffectivePublicUrl`
      # `ServiceUrl` ga tushadi va foydalanuvchi ochib bo'lmaydigan havola oladi.
      #
      # ⚠️ Xostni keyin QO'LDA almashtirib bo'lmaydi: SigV4 imzosi `host`
      # sarlavhasini qamrab oladi (`X-Amz-SignedHeaders=host`), ya'ni manzil
      # o'zgartirilsa ombor 403 qaytaradi. Shuning uchun imzo AYNI shu manzil
      # bilan yasalishi shart.
      Storage__PublicUrl: ${STORAGE_PUBLIC_URL:-}

      # ---- Telegram (FAZA 5.1) --------------------------------------------
      # O'quvchilar uchun YAGONA kirish yo'li. Dev'da odatda BO'SH: u holda
      # webhook 404 qaytaradi, Mini App kirishi 503 beradi va xabarlar
      # navbatdan logga tushadi — ya'ni ilova ODATDAGIDEK ishlaydi.
      #
      # ⚠️ `BotToken` va `WebhookSecret` JUFT: bittasi to'ldirilib ikkinchisi
      # bo'sh qolsa ilova ATAYLAB ko'tarilmaydi (`ValidateOnStart`). Sabab —
      # sirsiz webhook internetga OCHIQ qolardi: har kim soxta "yangilanish"
      # yuborib bot nomidan ish qildira olardi.
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__WebhookSecret: ${TELEGRAM_WEBHOOK_SECRET:-}
      Telegram__MiniAppUrl: ${TELEGRAM_MINI_APP_URL:-}
      Telegram__BotUsername: ${TELEGRAM_BOT_USERNAME:-}

      # ---- Notifikatsiya navbati (FAZA 5.2) -------------------------------
      # Telegram global chegarasi 30 xabar/sekund. 25 — ataylab pastroq:
      # chegaraga tegib 429 olgandan ko'ra sal sekin yuborgan afzal.
      Notifications__RateLimit__PerSecond: ${NOTIFY_RATE_PER_SECOND:-25}

      # ---- .NET ish faoliyati ---------------------------------------------
      # Server GC: ko'p yadroli, yuqori o'tkazuvchanlikli rejim. ASP.NET uchun
      # odatda sukut bo'yicha yoqiq, lekin konteynerda ba'zan Workstation GC
      # tanlanadi — aniq yozib qo'yamiz. 200 ta parallel SignalR ulanishida
      # GC pauzalari sezilarli qisqaradi.
      DOTNET_gcServer: "1"
      # Konteyner CPU/RAM chegarasini hurmat qilsin.
      DOTNET_GCHeapHardLimitPercent: "75"

    ports:
      # SPEC 8: host 5080 -> ichki 8080.
      - "5080:8080"

    volumes:
      # ASP.NET Data Protection kalit halqasi. Konteyner qayta yaratilganda
      # kalitlar yo'qolsa — shifrlangan cookie/antiforgery tokenlar buziladi.
      # (Backend `PersistKeysToFileSystem("/app/keys")` deb sozlashi kerak.)
      - dataprotection-keys:/app/keys

    depends_on:
      # HARD REQUIREMENT: api baza va redis TAYYOR bo'lgunicha kutadi.
      # `service_started` YETARLI EMAS — konteyner ko'tarilgani baza so'rov
      # qabul qilishga tayyor degani emas. Migratsiya "Connection refused"
      # bilan yiqilardi.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        # LiveKit sog'lomligini KUTMAYMIZ: api'ning ishga tushishi unga
        # bog'liq emas (token imzolash offline amal). Video kechroq
        # tayyor bo'lsa ham login/jadval ishlayveradi.
        condition: service_started

      # ⚠️ `minio` ATAYLAB YO'Q. Ikki sabab:
      #   1) api ishga tushishda omborga umuman tegmaydi — HTTP klient
      #      birinchi fayl so'ralganda yaratiladi;
      #   2) PROD'da bu xizmat butunlay o'chirilgan (u yerda R2 ishlatiladi).
      #      Bog'liqlik yozilsa, prod'da api mavjud bo'lmagan xizmatni
      #      kutib turib, umuman ko'tarilmasdi.

    healthcheck:
      # SPEC 5: /health/ready — baza va redis ulanishini ham tekshiradi.
      # aspnet:9.0-alpine da busybox wget bor, curl YO'Q.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # start_period 40s: EF Core migratsiyasi + JIT "isishi" uchun vaqt.
      # Bu davrda muvaffaqiyatsiz urinishlar "unhealthy" deb hisoblanmaydi.
      start_period: 40s

    networks: [zinnur-v2-net]

  # ===========================================================================
  #  WEB — Vue 3 + Vite, nginx orqali statik tarqatiladi
  # ===========================================================================
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # DIQQAT: bular BUILD-TIME. Vite ularni JS bundle ichiga "quyadi".
        # Qiymat o'zgarsa `docker compose build web` QAYTA bajarilishi shart —
        # konteynerni restart qilish YETARLI EMAS.
        VITE_API_URL: ${VITE_API_URL}
        VITE_HUB_URL: ${VITE_HUB_URL}
    image: zinnur/web:dev
    container_name: zinnur-v2-web
    restart: unless-stopped

    # nginx ishga tushgach bu o'zgaruvchilarni O'QIMAYDI (yuqoridagi izoh).
    # Shartnoma talabi bo'yicha ulanadi va kelajakda entrypoint-shablon
    # (envsubst) qo'shilsa darrov ishlatiladi.
    env_file:
      - .env

    ports:
      # SPEC 8: host 5173 -> ichki 80.
      - "5173:80"

    depends_on:
      api:
        # Frontend ochilganda api allaqachon javob bersin — birinchi
        # ekranda "Network Error" ko'rinmasin.
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks: [zinnur-v2-net]


# =============================================================================
#  TARMOQ
# =============================================================================
networks:
  # SPEC 8: `zinnur-v2-net`, bridge drayveri.
  # Barcha xizmatlar bir tarmoqda => bir-birini XIZMAT NOMI bilan topadi
  # (postgres, redis, livekit, api). IP manzil hech qayerda qo'lda yozilmaydi.
  zinnur-v2-net:
    name: zinnur-v2-net
    driver: bridge

# =============================================================================
#  VOLUME'LAR (nomlangan — restart/recreate'da ma'lumot YO'QOLMAYDI)
# =============================================================================
volumes:
  postgres-data:
    name: zinnur-v2-postgres-data
  redis-data:
    name: zinnur-v2-redis-data
  livekit-data:
    name: zinnur-v2-livekit-data
  dataprotection-keys:
    name: zinnur-v2-dataprotection-keys
  # Dev fayl ombori. `docker compose down` da SAQLANADI — sinov uchun
  # yuklangan rasmlar har restartda yo'qolib ketmasin.
  minio-data:
    name: zinnur-v2-minio-data
