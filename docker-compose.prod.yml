# ============================================================================
# ZIN-NUR — PRODUCTION overlay (Ubuntu server)
#
# Ishlatish:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Bu fayl `docker-compose.yml` ni TO'LDIRADI (almashtirmaydi). Faqat dev bilan
# prod ORASIDAGI FARQLARNI yozadi — takrorlanish yo'q (DRY).
#
# Uchta asosiy farq:
#   1) LiveKit host tarmog'ida ishlaydi  -> media umuman ishlashi uchun SHART
#   2) Postgres/Redis tashqariga chiqmaydi -> faqat 127.0.0.1
#   3) Resurs chegaralari + log rotatsiyasi
# ============================================================================

# ---------------------------------------------------------------------------
# LOG ROTATSIYASI — barcha xizmatlar uchun (YAML anchor, DRY).
# Buni O'TKAZIB YUBORMANG: cheklanmagan konteyner loglari diskni bir necha
# hafta ichida to'ldiradi va serverni to'xtatadi — "sababsiz o'chgan server"
# ning eng ko'p uchraydigan sababi.
# ---------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:

  # ==========================================================================
  # LIVEKIT — eng muhim farq shu yerda
  # ==========================================================================
  livekit:
    logging: *default-logging
    # ------------------------------------------------------------------
    # NEGA `network_mode: host` — BU ENG MUHIM SATR
    # ------------------------------------------------------------------
    # Bridge tarmog'ida LiveKit konteyner o'zining ICHKI IP'sini (172.x.x.x)
    # ICE nomzodlari sifatida e'lon qiladi. Natija o'zini YASHIRADI:
    #   - xona ochiladi           ✅
    #   - ishtirokchilar ro'yxati to'ladi ✅
    #   - ovoz va video UMUMAN KELMAYDI  ❌
    # Bu self-hosted LiveKit'dagi eng ko'p uchraydigan nosozlik va uni
    # topish qiyin, chunki loglarda xato ko'rinmaydi.
    #
    # Host tarmog'i buni butunlay yo'q qiladi: konteyner serverning haqiqiy
    # IP'sini ko'radi va to'g'ri nomzod e'lon qiladi.
    #
    # IKKINCHI FOYDA (200 foydalanuvchi uchun muhim): docker-proxy hop'i
    # yo'qoladi. Bridge'da HAR BIR UDP media paketi userland proxy orqali
    # o'tadi — bu 200 kishilik darsda sezilarli CPU va kechikish.
    #
    # ESLATMA: `network_mode: host` bilan `ports:` BIRGA ISHLATILMAYDI.
    # Shuning uchun quyida ports bekor qilinadi. Portlar endi to'g'ridan-to'g'ri
    # host'da ochiladi (UFW bilan boshqariladi — docs/DEPLOY_UBUNTU.md).
    #
    # macOS/Windows'da host tarmog'i to'liq ishlamaydi — shuning uchun bu
    # sozlama faqat PROD (Linux) faylida turadi, dev'da bridge qoladi.
    network_mode: host
    # `!reset` — bazaviy fayldagi qiymatni BEKOR qiladi (compose v2.24+).
    # network_mode va networks birga tura olmaydi, shuning uchun ikkalasini
    # ham tozalaymiz. Oddiy `[]` yetarli emas: overlay merge qiladi, almashtirmaydi.
    networks: !reset null
    ports: !reset null

    environment:
      # ⚠️ DEV OVERRIDE'LARINI BEKOR QILAMIZ — bu MAJBURIY.
      #
      # `docker-compose.yml` (dev) LiveKit'ga `NODE_IP=127.0.0.1` va
      # `LIVEKIT_RTC_USE_EXTERNAL_IP=false` beradi, chunki lokal mashinada
      # brauzer ham LiveKit ham bir joyda. Compose overlay'lari env'ni
      # BIRLASHTIRADI, ya'ni bu qiymatlar prod'ga ham o'tib ketardi.
      #
      # Production'da bu HALOKAT bo'lardi: LiveKit masofadagi brauzerlarga
      # `127.0.0.1` ni ICE nomzodi sifatida e'lon qilardi va media HECH QACHON
      # ishlamasdi — yana o'sha "xona ochiladi, ovoz yo'q" holati.
      #
      # `!reset` bilan ularni butunlay olib tashlaymiz (compose v2.24+).
      NODE_IP: !reset null
      LIVEKIT_RTC_USE_EXTERNAL_IP: !reset null
      LIVEKIT_RTC_ENABLE_LOOPBACK_CANDIDATE: !reset null

      # ------------------------------------------------------------------
      # 🔴 REDIS MANZILI — `network_mode: host` NING TO'G'RIDAN-TO'G'RI OQIBATI
      # ------------------------------------------------------------------
      # `infra/livekit/livekit.yaml` da `address: redis:6379` yozilgan va
      # izohida "Docker ichki DNS hal qiladi" deyilgan. Bu DEV'da to'g'ri,
      # PROD'da esa YO'Q: yuqoridagi `network_mode: host` konteynerni bridge
      # tarmog'idan butunlay chiqaradi, ya'ni Docker'ning ichki DNS'i
      # (127.0.0.11) O'CHADI. Konteyner host'ning resolver'iga (127.0.0.53)
      # murojaat qiladi, u esa `redis` degan nomni bilmaydi:
      #     lookup redis on 127.0.0.53:53: server misbehaving
      #     unable to connect to redis
      # LiveKit Redis'siz ishga tushmaydi — chiqib ketadi, `restart:
      # unless-stopped` uni qayta ko'taradi va cheksiz halqa hosil bo'ladi.
      # 7880 hech qachon ochilmaydi, nginx esa 502 qaytaradi.
      #
      # NEGA AYNAN 6390: prod'da Redis host'ga `127.0.0.1:6390:6379` bo'lib
      # chiqadi (quyidagi `redis` bloki). Host tarmog'idagi konteyner host
      # bilan BIR XIL tarmoq fazosida bo'lgani uchun o'sha loopback portni
      # to'g'ridan-to'g'ri ko'radi.
      #
      # `REDIS_HOST` — livekit-server HAQIQATAN o'qiydigan env (to'liq ro'yxat
      # docker-compose.yml dagi LiveKit izohida). U yaml dagi `redis.address`
      # ni bekor qiladi, shuning uchun alohida prod-yaml kerak emas.
      REDIS_HOST: 127.0.0.1:6390

      # Host tarmog'ida LiveKit serverning tashqi IP'sini o'zi aniqlaydi
      # (`use_external_ip: true`) — odatda shu yetarli.
      #
      # ⚠️ Bu yerda ilgari `LIVEKIT_NODE_IP` turardi — BUNDAY ENV YO'Q,
      # livekit-server uni JIMGINA E'TIBORSIZ QOLDIRADI. Ya'ni `SERVER_PUBLIC_IP`
      # ni to'ldirgan odam "sozladim" deb o'ylardi, aslida hech nima
      # o'zgarmasdi. To'g'ri nomi — `NODE_IP`.
      #
      # Avtomatik aniqlash xato ishlasa (bir nechta interfeys, GRE tunnel),
      # `.env` da SERVER_PUBLIC_IP ni to'ldiring va quyidagi qatorni yoqing:
      #   NODE_IP: ${SERVER_PUBLIC_IP:-}

    deploy:
      resources:
        limits:
          # SFU media'ni qayta kodlamaydi, faqat uzatadi — CPU asosan tarmoqqa
          # ketadi. 8 vCPU serverda 200 foydalanuvchi uchun 4 yadro yetarli,
          # qolgani api/postgres uchun qoladi.
          cpus: "${LIVEKIT_CPUS:-1.5}"
          memory: ${LIVEKIT_MEM:-768M}

  # ==========================================================================
  # POSTGRES — tashqariga CHIQARILMAYDI
  # ==========================================================================
  postgres:
    logging: *default-logging
    # DIQQAT: Docker'ning published portlari UFW qoidalarini CHETLAB O'TADI
    # (DOCKER-USER zanjiri orqali). Ya'ni `ufw deny 5432` bazani HIMOYA QILMAYDI.
    # Yagona ishonchli yechim — faqat localhost'ga bog'lash.
    # 🔴 `!override` MAJBURIY: Compose `ports` RO'YXATLARINI BIRLASHTIRADI,
    # almashtirmaydi. Usiz bazaviy fayldagi `"5440:5432"` (BARCHA interfeys!)
    # va bu yerdagi `"127.0.0.1:..."` IKKALASI ham qolardi:
    #   1) deploy yiqiladi — "failed to bind host port: address already in use"
    #   2) undan ham yomoni — baza/redis INTERNETGA OCHIQ bo'lib qolardi.
    ports: !override
      - "127.0.0.1:5440:5432"

    command:
      - postgres
      # 16 GB RAM li serverda ~25% shared_buffers (standart tavsiya)
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
      # max_connections: api pool (30) x replika soni + zaxira.
      # Kattaroq qilish foydasiz — har ulanish ~10 MB RAM oladi.
      - -c
      - max_connections=100
      # Sekin so'rovlarni logga yozamiz (1 sekunddan uzun)
      - -c
      - log_min_duration_statement=1000

    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPUS:-1.5}"
          memory: ${POSTGRES_MEM:-1G}

  # ==========================================================================
  # REDIS — tashqariga CHIQARILMAYDI
  # ==========================================================================
  redis:
    logging: *default-logging
    # 🔴 `!override` MAJBURIY: Compose `ports` RO'YXATLARINI BIRLASHTIRADI,
    # almashtirmaydi. Usiz bazaviy fayldagi `"5440:5432"` (BARCHA interfeys!)
    # va bu yerdagi `"127.0.0.1:..."` IKKALASI ham qolardi:
    #   1) deploy yiqiladi — "failed to bind host port: address already in use"
    #   2) undan ham yomoni — baza/redis INTERNETGA OCHIQ bo'lib qolardi.
    ports: !override
      - "127.0.0.1:6390:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 1gb
      # KRITIK: `allkeys-lru` QILMANG. Bu Redis uch vazifani bajaradi —
      # kesh, SignalR backplane va PRESENCE (davomat manbai). allkeys-lru da
      # xotira to'lganda presence kalitlari JIMGINA o'chiriladi va davomat
      # buziladi — hech qayerda xato ko'rinmaydi.
      - --maxmemory-policy
      - noeviction

    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPUS:-0.5}"
          memory: ${REDIS_MEM:-384M}

  # ==========================================================================
  # MINIO — PROD'DA ISHLAMAYDI
  # ==========================================================================
  #  Dev'da MinIO obyekt ombori vazifasini bajaradi. Prod'da esa fayllar
  #  Cloudflare R2 da yotadi va MinIO KERAK EMAS: u serverning diskini,
  #  xotirasini va (eng yomoni) ikkita ochiq portini bekorga band qilardi.
  #
  #  IKKI QATLAMLI TO'SIQ — ataylab:
  #    1) `profiles` — xizmat faqat ATAYLAB so'ralganda ishga tushadi;
  #       oddiy `docker compose up` uni umuman ko'rmaydi;
  #    2) portlar `127.0.0.1` ga bog'langan — kimdir profilni tasodifan
  #       yoqib yuborsa ham ombor internetdan OCHIQ bo'lib qolmaydi.
  #
  #  Bir qatlam yetarli emas: Docker'ning published portlari UFW qoidalarini
  #  CHETLAB O'TADI, ya'ni "keyin firewall bilan yopamiz" ishlamaydi.
  # ==========================================================================
  minio:
    profiles: ["dev-only"]
    logging: *default-logging
    # 🔴 `!override` MAJBURIY: Compose `ports` RO'YXATLARINI BIRLASHTIRADI,
    # almashtirmaydi. Usiz bazaviy fayldagi `"5440:5432"` (BARCHA interfeys!)
    # va bu yerdagi `"127.0.0.1:..."` IKKALASI ham qolardi:
    #   1) deploy yiqiladi — "failed to bind host port: address already in use"
    #   2) undan ham yomoni — baza/redis INTERNETGA OCHIQ bo'lib qolardi.
    ports: !override
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"

  minio-init:
    profiles: ["dev-only"]
    logging: *default-logging

  # ==========================================================================
  # API
  # ==========================================================================
  api:
    logging: *default-logging
    # 🔴 `!override` MAJBURIY: Compose `ports` RO'YXATLARINI BIRLASHTIRADI,
    # almashtirmaydi. Usiz bazaviy fayldagi `"5080:8080"` (BARCHA interfeys!)
    # va bu yerdagi `"127.0.0.1:..."` IKKALASI ham qolardi:
    #   1) deploy yiqiladi — "failed to bind host port: address already in use"
    #   2) undan ham yomoni — api INTERNETGA to'g'ridan ochiq bo'lardi, ya'ni
    #      nginx'ni (va TLS'ni) chetlab o'tib.
    ports: !override
      # Tashqariga host nginx chiqaradi (TLS bilan), api to'g'ridan ochilmaydi
      - "127.0.0.1:5080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # ---- OBYEKT OMBORI: DEV MinIO QIYMATLARI SHU YERDA O'LADI ----------
      #
      # ⚠️ BU BLOK MAJBURIY. Compose overlay'lari `environment` ni
      # BIRLASHTIRADI (almashtirmaydi): `docker-compose.yml` dagi
      # `Storage__ServiceUrl: http://minio:9000` shu yerda qayta
      # yozilmasa, PROD api mavjud bo'lmagan MinIO'ga murojaat qilardi va
      # o'quvchining har bir fayli 503 bilan yo'qolardi.
      #
      # Bu loyihada aynan shunday bug bir marta bo'lgan: dev LiveKit
      # sozlamalari (`NODE_IP=127.0.0.1`) prod'ga o'tib ketib, media umuman
      # ishlamagan edi. Shuning uchun dev va prod o'zgaruvchilari ATAYLAB
      # boshqa-boshqa nomlanadi (`STORAGE_*` va `R2_*`) — bir xil nom
      # ishlatilsa, "ustidan yozdim" degan ishonch soxta bo'lardi.
      #
      # TEKSHIRISH (dev qiymati oqib o'tmaganiga ishonch hosil qilish):
      #   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
      #     config | grep -i storage
      # Chiqishda `minio` so'zi UMUMAN bo'lmasligi kerak.
      #
      # `R2_*` bo'sh bo'lsa to'rttasi ham bo'sh bo'ladi => ombor
      # "sozlanmagan" holatga tushadi va fayl yuklash OCHIQ 503 beradi
      # (yarim sozlangan holatda esa ilova umuman ko'tarilmaydi).
      Storage__ServiceUrl: ${R2_SERVICE_URL:-}
      Storage__Bucket: ${R2_BUCKET:-}
      Storage__AccessKey: ${R2_ACCESS_KEY:-}
      Storage__SecretKey: ${R2_SECRET_KEY:-}
      Storage__Region: ${R2_REGION:-auto}
      # Prefiks sir emas, lekin u ham DEV faylidan meros qolmasin —
      # "bitta blok, oltita kalit" qoidasi buzilsa, keyingi safar
      # yangi kalit qo'shilganda aynan shu yerda unutilardi.
      Storage__KeyPrefix: ${R2_KEY_PREFIX:-submissions}
      # Server GC: ko'p yadroli serverda o'tkazuvchanlikni sezilarli oshiradi.
      # Konteynerda default Workstation GC bo'lib qolishi mumkin.
      DOTNET_gcServer: "1"
      # Konteyner xotira chegarasini GC hisobga olsin
      DOTNET_GCHeapHardLimitPercent: "75"

    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-1.5}"
          memory: ${API_MEM:-1G}

  # ==========================================================================
  # WEB (nginx + statik fayllar)
  # ==========================================================================
  web:
    logging: *default-logging
    # 🔴 `!override` MAJBURIY: Compose `ports` RO'YXATLARINI BIRLASHTIRADI,
    # almashtirmaydi. Usiz bazaviy fayldagi `"5440:5432"` (BARCHA interfeys!)
    # va bu yerdagi `"127.0.0.1:..."` IKKALASI ham qolardi:
    #   1) deploy yiqiladi — "failed to bind host port: address already in use"
    #   2) undan ham yomoni — baza/redis INTERNETGA OCHIQ bo'lib qolardi.
    ports: !override
      - "127.0.0.1:5173:80"

    deploy:
      resources:
        limits:
          cpus: "${WEB_CPUS:-0.5}"
          memory: ${WEB_MEM:-192M}
